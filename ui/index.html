<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SSH Lite</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="xterm.css">
<style>
  /* 어두운 남색 바탕 + 파란 강조 하나. 서버는 파랑, 내 PC는 초록 */
  @font-face { font-family: "Pretendard"; src: url("fonts/PretendardVariable.woff2") format("woff2"); font-weight: 45 920; font-display: swap; }
  @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono-Variable.woff2") format("woff2"); font-weight: 100 800; font-display: block; }
  :root {
    --bg: #0E1014;          /* 터미널 */
    --panel: #14171D;       /* 옆 패널, 탭 줄, 상태 줄 */
    --panel-2: #1A1E26;     /* 카드, 대화상자, 메뉴 */
    --raised: #1F242D;
    --hover: #1E232C;
    --select: rgba(110, 155, 255, .14);
    --line: #232832;
    --line-2: #2E3440;
    --text: #E4E8EF;
    --text-2: #D3D9E3;
    --muted: #8B94A5;
    --faint: #6B7485;
    --dim: #4A5262;
    --accent: #6E9BFF;
    --accent-btn: #4F7FF0;
    --accent-btn-hover: #5C8BFA;
    --on-accent: #FFFFFF;
    --accent-soft: rgba(110, 155, 255, .14);
    --accent-line: rgba(110, 155, 255, .55);
    --ok: #3FD08F;
    --danger: #FF6B6B;
    --danger-strong: #E5484D;
    --folder: #E9B44C;
    --side-w: 296px;
    --ui: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    --mono: "JetBrains Mono", "Cascadia Mono", Consolas, "D2Coding", "Malgun Gothic", monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  /* 스크롤바: Windows 기본 회색 막대·화살표 대신 얇고 어두운 막대 (트리, 터미널, 목록 모두) */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-button { display: none; }
  ::-webkit-scrollbar-thumb { background: #2A303B; border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background-color: #3A4250; }  /* 창 전체가 스크롤되면 오른쪽에 빈 스크롤바 칸이 생김 */
  body {
    background: var(--panel); color: var(--text); font: 13px/1.45 var(--ui);
    overflow: hidden; user-select: none; -webkit-font-smoothing: antialiased;
    font-feature-settings: "ss06";
  }
  button { font: inherit; color: inherit; }
  svg { display: block; flex: none; }
  [hidden] { display: none !important; }
  @keyframes rot { to { transform: rotate(360deg); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } }

  /* ---------- 공통: 버튼 / 입력칸 ---------- */
  .btn {
    height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-2);
    background: transparent; color: var(--text-2); font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background .12s, border-color .12s;
  }
  .btn:hover { background: var(--hover); border-color: #3A4150; color: var(--text); }
  .btn.primary { background: var(--accent-btn); border-color: var(--accent-btn); color: var(--on-accent); font-weight: 650; }
  .btn.primary:hover { background: var(--accent-btn-hover); border-color: var(--accent-btn-hover); }
  .btn.danger { background: var(--danger-strong); border-color: var(--danger-strong); color: #fff; }
  .btn.danger:hover { background: #F05A5F; }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn:focus-visible, .icon-btn:focus-visible, .crumb:focus-visible { outline: 2px solid var(--accent-line); outline-offset: 1px; }
  .icon-btn {
    width: 28px; height: 28px; border-radius: 6px; border: 0; background: transparent; color: var(--muted);
    display: grid; place-items: center; cursor: pointer; transition: background .12s, color .12s;
  }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .icon-btn.active { color: var(--accent); }
  .field {
    width: 100%; height: 36px; padding: 0 11px; border-radius: 7px; border: 1px solid var(--line-2);
    background: var(--bg); color: var(--text); font: 13px var(--ui); outline: none;
    transition: border-color .12s, box-shadow .12s; user-select: text;
  }
  .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(110, 155, 255, .16); }
  .field.mono { font-family: var(--mono); font-size: 12.5px; }
  .label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px; }
  .spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #2E3440; border-top-color: var(--accent); animation: rot .8s linear infinite; flex: none; }
  .btn.primary .spin { border-color: rgba(255, 255, 255, .35); border-top-color: var(--on-accent); }

  /* ---------- 큰 틀 ---------- */
  .workspace { height: calc(100% - 28px); display: grid; grid-template-columns: min(var(--side-w), 45vw) minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr); }  /* 파일이 많아도 트리 안에서만 스크롤 (아래 상태 줄을 덮지 않게) */  /* 창을 작게 줄이면 옆 패널도 같이 줄어듦 */
  .sidebar { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; background: var(--panel); border-right: 1px solid var(--line); }
  .side-top {
    height: 40px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 14px;
    border-bottom: 1px solid var(--line);
  }
  .mark { flex: none; width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(140deg, #7EA6FF, #4F7FF0); color: #fff; display: grid; place-items: center; box-shadow: 0 2px 10px rgba(79, 127, 240, .35); }
  .brand { flex: none; white-space: nowrap; font-weight: 650; letter-spacing: -.01em; }
  /* 옆 패널을 좁히면 로고·이름은 그대로, 접속 정보만 줄어듦 (말줄임) */
  .pill {
    margin-left: auto; min-width: 0; flex: 0 1 auto; height: 26px; display: flex; align-items: center; gap: 7px; padding: 0 10px;
    border-radius: 13px; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); font-size: 12px;
  }
  .pill #pillText { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill .dot { width: 6px; height: 6px; border-radius: 3px; background: var(--dim); flex: none; }
  .pill.on { color: var(--text-2); }
  .pill.on .dot { background: var(--ok); }
  .pill.lost .dot { background: var(--danger); }
  .pill.busy .dot { background: transparent; border: 1.5px solid #2E3440; border-top-color: var(--accent); width: 9px; height: 9px; border-radius: 50%; animation: rot .8s linear infinite; }
  .splitter { position: absolute; top: 0; right: -4px; width: 8px; height: 100%; cursor: col-resize; z-index: 5; }
  .splitter:hover, .splitter.drag { background: linear-gradient(90deg, transparent 3px, var(--accent-line) 3px, var(--accent-line) 5px, transparent 5px); }

  /* ---------- 접속 카드 (연결 전 왼쪽) ---------- */
  .connect-pane { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 14px; overflow: auto; }
  .cp-card { padding: 16px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
  .cp-head { display: flex; align-items: baseline; justify-content: space-between; }
  .cp-head b { font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
  .cp-head span { font-size: 11.5px; color: var(--faint); }
  .cp-row { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 10px; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--muted); cursor: pointer; font-size: 12.5px; }
  .check input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  .connect-pane .btn.primary { width: 100%; height: 38px; font-size: 13.5px; }
  .login-error { margin: 0; display: flex; gap: 8px; align-items: flex-start; color: var(--danger); font-size: 12.5px; line-height: 1.5; }
  .login-error:empty { display: none; }
  .login-error.info { color: var(--muted); align-items: center; }
  .login-error.info::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #2E3440; border-top-color: var(--accent); animation: rot .8s linear infinite; flex: none; }
  .hint { padding: 0 4px; color: var(--faint); font-size: 12px; line-height: 1.6; }

  /* ---------- 파일 트리 ---------- */
  .files-pane { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .side-head { display: flex; align-items: center; gap: 2px; padding: 8px 8px 6px 10px; }
  .crumbs { flex: 1; min-width: 0; display: flex; align-items: center; gap: 1px; overflow-x: auto; scrollbar-width: none; white-space: nowrap; font-size: 12.5px; }
  .crumbs::-webkit-scrollbar { display: none; }
  .crumb { border: 0; background: transparent; color: var(--faint); padding: 3px 4px; border-radius: 5px; cursor: pointer; }
  .crumb:hover { background: var(--hover); color: var(--text); }
  .crumb.last { color: var(--text); font-weight: 650; }
  .crumb-sep { color: var(--dim); padding: 0 1px; }
  .tree { flex: 1; min-height: 0; overflow: auto; padding: 2px 8px 16px; outline: none; position: relative; }
  .row {
    height: 28px; display: flex; align-items: center; gap: 7px; padding: 0 8px 0 calc(6px + var(--d) * 16px);
    border-radius: 6px; white-space: nowrap; cursor: default; color: var(--text-2);
  }
  .row:hover { background: var(--hover); }
  .row.sel { background: var(--select); color: var(--text); }
  .tree:focus .row.sel { box-shadow: inset 0 0 0 1px rgba(110, 155, 255, .3); }
  .row.drop { background: rgba(110, 155, 255, .08); box-shadow: inset 0 0 0 1px var(--accent); }
  .row.drop .meta { display: none; }
  .row.drop::after { content: "여기에 놓기"; color: var(--accent); font-size: 11px; font-weight: 600; }
  .row.dest { background: rgba(110, 155, 255, .10); box-shadow: inset 0 0 0 1px var(--accent); }
  .row.dest .meta { display: none; }
  .row.dest::after { content: "옮길 곳"; color: var(--accent); font-size: 11px; font-weight: 600; }
  .row .chev { width: 14px; height: 14px; display: grid; place-items: center; color: var(--faint); transition: transform .12s; }
  .row.open .chev { transform: rotate(90deg); }
  .row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .row .meta { color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
  .row.note { color: var(--faint); font-size: 12px; }
  .row .link { color: var(--faint); font-size: 11px; }
  .empty { padding: 40px 20px; text-align: center; color: var(--faint); font-size: 12.5px; line-height: 1.7; }
  .tree.drop-root { box-shadow: inset 0 0 0 1px var(--accent); background: rgba(110, 155, 255, .05); border-radius: 8px; }
  .drop-hint {
    position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 4; padding: 9px 12px; border-radius: 9px;
    background: var(--panel-2); border: 1px solid var(--accent); color: var(--text-2); font-size: 12.5px;
    display: flex; gap: 8px; align-items: center; pointer-events: none; box-shadow: 0 12px 30px rgba(0, 0, 0, .45);
  }
  .drop-hint svg { color: var(--accent); }
  .drop-hint b { color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }

  /* ---------- 터미널 탭 ---------- */
  .term-wrap { position: relative; min-width: 0; min-height: 0; background: var(--bg); display: flex; flex-direction: column; }
  .tabbar { height: 40px; flex: none; display: flex; align-items: stretch; background: var(--panel); border-bottom: 1px solid var(--line); padding-left: 6px; }
  .tabs { display: flex; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    position: relative; flex: 0 1 auto; min-width: 84px; max-width: 240px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px;
    border-right: 1px solid var(--line); color: var(--muted); cursor: pointer; touch-action: none;
  }
  .tab:first-child { border-left: 1px solid var(--line); }
  .tab:hover { color: var(--text); background: #181C23; }
  .tab.active { background: var(--bg); color: var(--text); margin-bottom: -1px; }
  .tab.active::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--accent); }
  .tab.local.active::before { background: var(--ok); }
  .tab.dead { color: var(--dim); }
  .tab.dead.active::before { background: var(--dim); }
  .tab { transition: transform .18s cubic-bezier(.2, .8, .2, 1), color .12s, background .12s; }
  .tab.lifting {
    transition: none; z-index: 3; cursor: grabbing; background: var(--panel-2);
    box-shadow: 0 8px 22px rgba(0, 0, 0, .45), 0 0 0 1px var(--line-2);
  }
  .tab.lifting.active { background: var(--bg); }
  .tabs.sorting .tab { cursor: grabbing; }
  .tab.entering { animation: tabIn .2s cubic-bezier(.2, .8, .2, 1); }
  @keyframes tabIn { from { opacity: 0; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { .tab, .tab.entering { transition: none; animation: none; } }
  .tab-ico { color: var(--accent); display: grid; place-items: center; }
  .tab.local .tab-ico { color: var(--ok); }
  .tab.dead .tab-ico { color: var(--dim); }
  .tab:not(.active) .tab-ico { opacity: .7; }
  .tab.running .tab-ico svg { display: none; }
  .tab.running .tab-ico::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #2E3440; border-top-color: var(--accent); animation: rot .9s linear infinite; }
  .tab.local.running .tab-ico::before { border-top-color: var(--ok); }
  .tab-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab.active .tab-title { font-weight: 550; }
  .tab-unread { width: 6px; height: 6px; border-radius: 3px; background: var(--accent); flex: none; }
  .tab.local .tab-unread { background: var(--ok); }
  .tab-x {
    width: 20px; height: 20px; margin-left: auto; border: 0; border-radius: 4px; background: transparent; color: var(--faint);
    display: grid; place-items: center; cursor: pointer; opacity: 0; flex: none;
  }
  .tab:hover .tab-x, .tab.active .tab-x, .tab-x:focus-visible { opacity: 1; }
  .tab-x:hover { background: var(--line-2); color: var(--text); }
  .tab-add { align-self: center; margin-left: 4px; width: 30px; height: 30px; flex: none; }
  .tab-menu { align-self: center; margin: 0 8px 0 auto; width: 30px; height: 30px; flex: none; }
  .term-stack { position: relative; flex: 1; min-height: 0; }
  .term-pane { position: absolute; inset: 12px 8px 6px 16px; display: none; }
  .term-pane.active { display: block; }
  .term-empty { position: absolute; inset: 40px 0 0 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--faint); }
  .term-empty p { margin: 0; }
  .empty-actions { display: flex; gap: 8px; }
  .term-banner {
    position: absolute; left: 50%; top: 54px; transform: translateX(-50%); z-index: 6; display: flex; align-items: center; gap: 12px;
    padding: 6px 6px 6px 14px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line-2);
    box-shadow: 0 14px 36px rgba(0, 0, 0, .45); color: var(--text-2); white-space: nowrap; animation: pop .14s ease-out;
  }
  .term-banner::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #2E3440; border-top-color: var(--accent); animation: rot .8s linear infinite; }
  .term-banner .btn { height: 30px; padding: 0 12px; font-size: 12.5px; background: var(--raised); }
  .search-bar {
    position: absolute; top: 52px; right: 18px; z-index: 7; display: flex; align-items: center; gap: 2px;
    padding: 4px 4px 4px 12px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line-2);
    box-shadow: 0 12px 32px rgba(0, 0, 0, .45); animation: pop .12s ease-out;
  }
  .search-bar .sb-ico { color: var(--faint); margin-right: 6px; }
  .search-bar input { width: 210px; height: 28px; border: 0; outline: none; background: transparent; color: var(--text); font: 13px var(--mono); user-select: text; }
  .search-bar .sb-status { min-width: 40px; color: var(--faint); font-size: 11.5px; text-align: right; margin-right: 4px; font-variant-numeric: tabular-nums; }
  .search-bar .sb-status.miss { color: var(--danger); }
  .zoom-badge {
    position: absolute; top: 52px; left: 50%; transform: translateX(-50%); z-index: 7; padding: 6px 12px;
    border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line-2); color: var(--text-2); font-size: 12px; pointer-events: none;
  }

  /* ---------- 트리 거르기 ---------- */
  /* 항상 트리 위에 있는 거르기 칸: 평소엔 조용히, 누르면 파란 테두리 */
  .tree-filter {
    flex: none; margin: 0 8px 6px; height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 2px 0 10px;
    border-radius: 8px; background: var(--bg); border: 1px solid var(--line); transition: border-color .12s, box-shadow .12s;
  }
  .tree-filter:hover { border-color: var(--line-2); }
  .tree-filter:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .tree-filter input::placeholder { color: var(--faint); }
  .tree-filter > span:first-child { color: var(--faint); }
  .tree-filter input { flex: 1; min-width: 0; height: 28px; border: 0; outline: none; background: transparent; color: var(--text); font: 13px var(--ui); user-select: text; }
  .tree-filter .f-count { color: var(--faint); font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tree-filter .icon-btn { width: 24px; height: 24px; }
  .row mark { background: rgba(110, 155, 255, .3); color: var(--text); border-radius: 3px; padding: 0 1px; }

  /* ---------- 상태 줄 ---------- */
  .statusbar {
    height: 28px; display: flex; align-items: center; gap: 16px; padding: 0 8px 0 14px;
    border-top: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden;
  }
  .sb-where { display: flex; align-items: center; gap: 7px; min-width: 0; flex: 0 3 auto; overflow: hidden; text-overflow: ellipsis; }
  .sb-where .dot { width: 6px; height: 6px; border-radius: 3px; background: var(--dim); flex: none; }
  .sb-where.ssh .dot { background: var(--accent); }
  .sb-where.local .dot { background: var(--ok); }
  .sb-where.lost .dot { background: var(--danger); }
  /* 자리가 모자라면 접속 정보 -> 파일 이름 순으로 줄어듦 (진행 막대와 취소 버튼은 항상 보이게) */
  .transfer { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 0 1 auto; }
  .transfer > * { flex: none; }
  .transfer .t-name { flex: 0 1 auto; min-width: 40px; white-space: nowrap; }
  .transfer .t-kind { color: var(--accent); font-weight: 600; }
  .transfer .t-name { color: var(--text-2); max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .transfer .bar { width: 120px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; flex: none; }
  .transfer .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
  .transfer .t-num { font-variant-numeric: tabular-nums; }
  .transfer .icon-btn { width: 20px; height: 20px; border-radius: 4px; }
  .transfer .t-speed { color: var(--text-2); }
  /* 서버 사용량: 오른쪽, 얇은 구분선으로 나눈 한 줄 */
  .sb-stats { display: flex; align-items: center; color: var(--text-2); font-variant-numeric: tabular-nums; flex: none; }
  .sb-stats .stat { position: relative; display: flex; align-items: center; gap: 5px; padding: 0 11px; }
  .sb-stats::after { content: ""; width: 1px; height: 12px; margin-right: 4px; background: var(--line-2); }
  .sb-stats .stat + .stat::before {
    content: ""; position: absolute; left: 0; top: 50%; width: 1px; height: 12px; margin-top: -6px; background: var(--line-2);
  }
  .sb-stats .k { color: var(--faint); }
  .sb-stats .v { color: var(--text-2); font-weight: 600; }
  .sb-stats .net-up { color: var(--ok); }
  .sb-stats .net-down { color: var(--accent); }
  .sb-stats .meter { width: 20px; height: 3px; margin-left: 2px; border-radius: 2px; background: var(--line-2); overflow: hidden; }
  .sb-stats .meter > i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
  .sb-stats .stat.warm .v { color: var(--folder); }
  .sb-stats .stat.warm .meter > i { background: var(--folder); }
  .sb-stats .stat.hot .v { color: var(--danger); }
  .sb-stats .stat.hot .meter > i { background: var(--danger); }
  .sb-stats .stat-err { border: 0; background: transparent; color: var(--danger); padding: 2px 8px; margin-right: 6px; border-radius: 4px; cursor: pointer; font: inherit; }
  .sb-stats .stat-err:hover { background: rgba(255, 107, 107, .12); }
  .sb-stats { cursor: pointer; }
  .sb-stats .stat.xd .k { max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 폰: 외장 디스크가 있다는 작은 표시 (자리를 차지하지 않게 디스크 칸 오른쪽 위에 띄움) */
  .sb-stats .xmore { position: absolute; top: 5px; right: 1px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); pointer-events: none; }
  .mobile .sb-stats .stat.xd { display: none; }
  @media (max-width: 1000px) { .sb-stats .stat.xd .meter { display: none; } }
  .sd { display: grid; gap: 2px; }
  .sd-row { display: grid; grid-template-columns: 72px 1fr 64px 36px; align-items: center; gap: 4px 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .sd-row:last-child { border-bottom: 0; }
  .sd-k { color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sd-v { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sd-v.wide { grid-column: 2 / -1; }
  .sd-bar { height: 4px; border-radius: 2px; background: var(--line-2); overflow: hidden; }
  .sd-bar > i { display: block; height: 100%; background: var(--accent); }
  .sd-bar.warm > i { background: var(--folder); }
  .sd-bar.hot > i { background: var(--danger); }
  .sd-pct { color: var(--text-2); text-align: right; font-variant-numeric: tabular-nums; }
  .sd-sub { grid-column: 2 / -1; color: var(--faint); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sd-note { margin: 8px 0 0; color: var(--faint); font-size: 12px; }
  /* 창이 좁거나 전송 중이면 덜 중요한 것(네트워크, 가동 시간)은 숨김 */
  .statusbar.busy .sb-stats .opt, .statusbar.busy .sb-stats .xd, .statusbar.busy .sb-uptime { display: none; }
  @media (max-width: 1100px) { .sb-stats .opt { display: none; } }
  @media (max-width: 900px) { .sb-uptime { display: none; } }
  @media (max-width: 640px) { .sb-stats .meter { display: none; } }
  .sb-right { margin-left: auto; display: flex; align-items: center; gap: 2px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .sb-uptime { color: var(--faint); flex: none; margin-left: -10px; }
  .sb-uptime::before { content: "·"; margin-right: 6px; color: var(--dim); }
  #sbFollow { display: grid; place-items: center; width: 20px; height: 20px; padding: 0; color: var(--dim); }
  #sbFollow.on { color: var(--accent); }
  .sb-right button { border: 0; background: transparent; color: inherit; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
  .sb-right button:hover { background: var(--hover); color: var(--text); }

  /* ---------- 대화상자 / 메뉴 / 알림 ---------- */
  .backdrop { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(4, 6, 9, .62); animation: fade .12s ease-out; }
  .dialog {
    width: 400px; max-width: calc(100vw - 32px); padding: 20px; border-radius: 12px;
    background: var(--panel-2); border: 1px solid var(--line-2); box-shadow: 0 24px 60px rgba(0, 0, 0, .5); animation: pop .14s ease-out;
  }
  .dialog h3 { margin: 0 0 4px; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
  .dialog .body { color: var(--muted); margin-bottom: 14px; user-select: text; }
  .dialog .body p { margin: 0 0 8px; }
  .dialog .body b { color: var(--text-2); font-weight: 600; }
  .dialog .field { height: 38px; font-size: 14px; }
  .dialog table.help { width: 100%; border-collapse: collapse; font-size: 13px; }
  .dialog table.help th { text-align: left; white-space: nowrap; padding: 5px 14px 5px 0; color: var(--text); font-weight: 600; vertical-align: top; }
  .dialog table.help td { padding: 5px 0; color: var(--text-2); }
  .dialog p.ver { margin: 12px 0 0; color: var(--faint); font-size: 11.5px; }
  .dialog table.help tr.sep td { padding: 4px 0; border-bottom: 1px solid var(--line); }
  .dialog:has(table.help) { width: min(620px, calc(100vw - 32px)); max-width: none; }
  .dialog:has(table.help) .body { max-height: 62vh; overflow: auto; }
  .mobile .dialog table.help th { white-space: normal; width: 42%; }
  .field.invalid { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(255, 107, 107, .15); }
  .dialog .mono { font: 12px/1.6 var(--mono); color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; word-break: break-all; }
  .dialog .list { max-height: 160px; overflow: auto; font: 12px/1.7 var(--mono); color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  .dialog .dlg-error { color: var(--danger); font-size: 12px; min-height: 18px; margin: 8px 0 0; }
  .dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .menu {
    position: fixed; z-index: 60; min-width: 230px; padding: 5px; border-radius: 10px; background: var(--panel-2);
    border: 1px solid var(--line-2); box-shadow: 0 18px 48px rgba(0, 0, 0, .5); animation: fade .08s;
  }
  .menu button {
    width: 100%; height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border: 0;
    background: transparent; border-radius: 6px; cursor: pointer; text-align: left; color: var(--text-2);
  }
  .menu button:hover { background: var(--select); color: var(--text); }
  .menu button svg { color: var(--muted); }
  .menu button .kbd { margin-left: auto; color: var(--faint); font-size: 11px; padding-left: 12px; }
  .menu button.on svg { color: var(--accent); }
  .menu button.danger, .menu button.danger svg { color: var(--danger); }
  .menu button.danger:hover { background: rgba(255, 107, 107, .12); }
  .menu hr { border: 0; height: 1px; background: var(--line-2); margin: 5px 6px; }
  .toasts { position: fixed; right: 16px; bottom: 40px; z-index: 70; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .toast {
    display: flex; align-items: center; gap: 12px; max-width: 440px; padding: 10px 10px 10px 14px; border-radius: 10px;
    background: var(--panel-2); border: 1px solid var(--line-2); box-shadow: 0 14px 36px rgba(0, 0, 0, .45); animation: pop .14s; color: var(--text-2);
  }
  .toast .ic { color: var(--ok); }
  .toast.err { border-color: #5A2E33; }
  .toast.err .ic { color: var(--danger); }
  .toast .msg { flex: 1; }
  .toast .act { border: 0; background: transparent; color: var(--accent); font-weight: 650; cursor: pointer; padding: 5px 8px; border-radius: 6px; }
  .toast .act:hover { background: var(--accent-soft); }

  /* ================= 폰 (안드로이드 앱): 왼쪽 트리는 서랍, 터미널 아래에 키 줄 ================= */
  .btn-drawer, .drawer-backdrop, .keyrow { display: none; }
  .mobile, .mobile body { -webkit-tap-highlight-color: transparent; }
  .mobile .tree, .mobile .tabbar, .mobile .keyrow, .mobile .side-head, .mobile .statusbar { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .mobile .workspace { grid-template-columns: minmax(0, 1fr); }
  .mobile .sidebar {
    position: fixed; z-index: 40; top: 0; bottom: 0; left: 0; width: min(86vw, 360px);
    transform: translateX(-102%); transition: transform .24s cubic-bezier(.2, .8, .2, 1); border-right: 1px solid var(--line-2);
  }
  .mobile.drawer-open .sidebar { transform: none; box-shadow: 12px 0 40px rgba(0, 0, 0, .5); }
  .mobile .sidebar.dragging { transition: none; }
  .mobile .splitter { display: none; }
  .mobile .drawer-backdrop {
    display: block; position: fixed; inset: 0; z-index: 39; background: rgba(5, 7, 10, .55);
    opacity: 0; pointer-events: none; transition: opacity .24s;
  }
  .mobile.drawer-open .drawer-backdrop { opacity: 1; pointer-events: auto; }
  .mobile .drawer-backdrop.dragging { transition: none; }
  .mobile .icon-btn.btn-drawer { display: grid; flex: none; width: 44px; height: 100%; border-radius: 0; color: var(--text-2); border-right: 1px solid var(--line); }
  .mobile .tabbar { padding-left: 0; height: 44px; }
  .mobile .tab { min-width: 72px; padding: 0 4px 0 12px; }
  /* 폰은 마우스를 올릴 수 없어서, 안 보이는 ✕ 를 잘못 눌러 탭이 닫히지 않게: 지금 탭에만, 손가락 크기로 */
  .mobile .tab:not(.active) .tab-x { display: none; }
  .mobile .tab-x { width: 32px; height: 32px; }
  .mobile .row { height: 38px; font-size: 14px; }
  .mobile .row:active { background: var(--hover); }  /* 누르는 순간 바로 보이게 */
  /* 위아래 스크롤은 브라우저가, 옆으로 미는 건 앱(서랍)이 받게: 둘이 손가락을 서로 뺏지 않음 */
  .mobile .sidebar, .mobile .tree, .mobile .term-stack, .mobile .drawer-backdrop { touch-action: pan-y; }
  .mobile .side-head { height: 44px; }
  .mobile .icon-btn { width: 34px; height: 34px; }
  .mobile .tabbar .icon-btn:not(.btn-drawer) { width: 40px; height: 40px; }
  .mobile .statusbar { height: 32px; }
  .mobile .workspace { height: calc(100% - 32px); }
  .mobile .sb-right button { min-height: 28px; padding: 2px 10px; }
  .mobile .tree-filter { height: 36px; }
  .mobile .tree-filter input { font-size: 14px; }
  .mobile .field { font-size: 16px; height: 42px; }  /* 16px 보다 작으면 폰이 입력할 때 화면을 확대함 */
  .mobile .btn.primary { height: 44px; }
  .mobile .sb-where, .mobile .sb-uptime, .mobile #sbFollow { display: none !important; }
  .mobile .statusbar { padding: 0 6px 0 4px; }
  .mobile .sb-right { margin-left: auto; }
  .mobile .sb-stats .stat { padding: 0 7px; gap: 4px; }  /* 메모리·디스크를 사용/전체로 보여서 폰 폭에 맞게 조금 좁게 */
  .mobile .sb-stats::after { margin-right: 0; }
  .mobile .menu { min-width: 220px; max-width: calc(100vw - 16px); }
  .mobile .menu button { min-height: 42px; }
  .mobile .dialog { width: calc(100vw - 24px); max-width: 440px; }
  .mobile .toasts { left: 12px; right: 12px; bottom: 96px; align-items: stretch; pointer-events: none; }
  .mobile.drawer-open .toasts { top: 12px; bottom: auto; }  /* 서랍이 열려 있으면 아래 막대(옮기기 등)를 가리지 않게 위로 */
  .mobile .toast { max-width: none; pointer-events: none; }  /* 알림이 터미널 아래쪽을 가려도 손가락은 터미널로 */
  .mobile .toast button, .mobile .toast a { pointer-events: auto; }
  /* 키 줄: 폰 키보드에 없는 키. 눌러도 키보드가 닫히지 않게 포커스를 가져가지 않음 */
  .mobile .keyrow {
    display: flex; flex: none; gap: 4px; padding: 6px 6px; overflow-x: auto; scrollbar-width: none;
    background: var(--panel); border-top: 1px solid var(--line);
  }
  .mobile .keyrow::-webkit-scrollbar { display: none; }
  .keyrow button {
    flex: none; min-width: 38px; height: 38px; padding: 0 6px; border-radius: 8px; border: 1px solid var(--line-2);
    background: var(--panel-2); color: var(--text-2); font: 600 13px var(--ui); touch-action: manipulation;
  }
  .keyrow button.wide { min-width: 50px; }
  .keyrow button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
  .keyrow button:active, .keyrow button.press { background: var(--raised); color: var(--text); }
  .keyrow .gap { flex: none; width: 4px; }
  /* 터미널의 숨은 입력칸은 한글을 칠 때 커서 위치로 옮겨짐. 거기를 길게 누르면 폰이 키보드와 자기 선택 메뉴를 띄워서
     화면이 꼬임 -> 손가락은 늘 터미널 화면이 받게 (누르면 키보드가 뜨는 건 xterm 이 알아서 함) */
  .mobile .term-stack { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .mobile .term-stack .xterm-helper-textarea, .mobile .term-stack .composition-view { pointer-events: none !important; }
  /* 구간 선택: 키 줄 자리에 안내와 복사/취소 */
  /* 다른 폴더로 옮기기: 트리 아래 막대. 옮길 항목은 흐리게, 고른 폴더는 파란 테두리 */
  .movebar:not([hidden]) {
    flex: none; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px 12px;
    background: var(--panel-2); border-top: 1px solid var(--accent-line);
  }
  .movebar .mv-hint { color: var(--text-2); font-size: 13px; line-height: 1.4; word-break: break-all; }
  .movebar .mv-hint b { color: var(--text); font-weight: 600; }
  .movebar .mv-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .movebar .btn { height: 38px; padding: 0 16px; }
  .movebar .btn.primary:disabled { opacity: .45; }
  .row.moving { opacity: .45; }
  .row .pick { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--dim); display: grid; place-items: center; color: transparent; }
  .row.sel .pick { background: var(--accent-btn); border-color: var(--accent-btn); color: #fff; }
  .movebar .btn:disabled { opacity: .45; }
  #btnPickDelete { color: var(--danger); }
  .selbar { display: none; }
  .mobile .selbar:not([hidden]) {
    display: flex; flex: none; align-items: center; gap: 8px; height: 51px; padding: 0 8px 0 12px;
    background: var(--panel-2); border-top: 1px solid var(--accent-line);
  }
  .mobile .selbar .sel-hint { flex: 1; min-width: 0; color: var(--text-2); font-size: 13px; line-height: 1.3; }
  .mobile .selbar .sel-hint b { color: var(--text); font-weight: 600; }
  .mobile .selbar .btn { height: 38px; padding: 0 16px; }
  .mobile .term-stack.selecting { box-shadow: inset 0 0 0 1px var(--accent-line); }
  /* 선택하는 동안 터미널 위를 덮는 투명한 판: 손가락을 이 판이 받음
     (xterm 은 선택을 그릴 때 안쪽 요소를 지웠다 다시 만들어서, 그 요소에서 시작한 터치는 중간에 끊김) */
  .sel-layer { position: absolute; inset: 0; z-index: 30; touch-action: none; }
</style>
</head>
<body>
  <main class="workspace" id="workspace">
    <aside class="sidebar" id="sidebar">
      <div class="side-top">
        <span class="mark" data-icon="prompt"></span>
        <span class="brand">SSH Lite</span>
        <div class="pill" id="pill"><span class="dot"></span><span id="pillText">연결 안 됨</span></div>
      </div>
      <form class="connect-pane" id="loginForm" autocomplete="off">
        <div class="cp-card">
          <div class="cp-head"><b>서버</b><span>빠른 연결</span></div>
          <div><label class="label" for="host">호스트</label><input class="field" id="host" spellcheck="false" placeholder="예: myserver.example.com" autocapitalize="off"></div>
          <div class="cp-row">
            <div><label class="label" for="port">포트</label><input class="field mono" id="port" inputmode="numeric" placeholder="22"></div>
            <div><label class="label" for="user">사용자</label><input class="field" id="user" spellcheck="false" placeholder="사용자 이름" autocapitalize="off"></div>
          </div>
          <label class="check"><input type="checkbox" id="autoConnect">앱을 켜면 바로 연결</label>
          <button class="btn primary" id="btnConnect" type="submit">연결</button>
          <p class="login-error" id="loginError"></p>
        </div>
        <p class="hint" id="keyHint"></p>
      </form>
      <div class="files-pane" id="filesPane" hidden>
        <div class="side-head">
          <nav class="crumbs" id="crumbs" aria-label="현재 폴더"></nav>
          <button class="icon-btn" id="btnUp" title="상위 폴더 (Backspace)" aria-label="상위 폴더" data-icon="up"></button>
          <button class="icon-btn" id="btnUpload" title="업로드 (탐색기에서 끌어다 놓아도 돼요)" aria-label="업로드" data-icon="upload"></button>
          <button class="icon-btn" id="btnSideMenu" title="새 폴더 · 새로고침 · 보기" aria-label="파일 메뉴" data-icon="more"></button>
        </div>
        <div class="tree-filter" id="treeFilter">
          <span data-icon="search"></span>
          <input id="filterInput" placeholder="이름으로 거르기" aria-label="이름으로 거르기" spellcheck="false">
          <span class="f-count" id="filterCount"></span>
          <button class="icon-btn" id="btnFilterClose" title="지우기 (Esc)" aria-label="거르기 지우기" data-icon="x" hidden></button>
        </div>
        <div class="tree" id="tree" tabindex="0" aria-label="서버 파일"></div>
        <div class="movebar" id="pickBar" hidden>
          <span class="mv-hint" id="pickHint"></span>
          <div class="mv-actions">
            <button class="btn" id="btnPickCancel">취소</button>
            <button class="btn" id="btnPickDelete">삭제</button>
            <button class="btn" id="btnPickDownload">받기</button>
            <button class="btn primary" id="btnPickMove">옮기기</button>
          </div>
        </div>
        <div class="movebar" id="moveBar" hidden>
          <span class="mv-hint" id="moveHint"></span>
          <div class="mv-actions">
            <button class="btn" id="btnMoveCancel">취소</button>
            <button class="btn primary" id="btnMoveHere">여기로 옮기기</button>
          </div>
        </div>
        <div class="drop-hint" id="dropHint" hidden><span data-icon="upload"></span><span>여기에 업로드</span><b id="dropHintPath"></b></div>
      </div>
      <div class="splitter" id="splitter"></div>
    </aside>
    <section class="term-wrap">
      <div class="tabbar" id="tabbar">
        <button class="icon-btn btn-drawer" id="btnDrawer" title="서버 파일" aria-label="서버 파일 열기" data-icon="menu"></button>
        <div class="tabs" id="tabs" role="tablist" aria-label="터미널"></div>
        <button class="icon-btn tab-add" id="btnNewTab" title="새 탭" aria-label="새 탭" data-icon="plus"></button>
        <button class="icon-btn tab-menu" id="btnMenu" title="메뉴" aria-label="메뉴" data-icon="more"></button>
      </div>
      <div class="term-stack" id="termStack"><div class="sel-layer" id="selLayer" hidden></div></div>
      <div class="keyrow" id="keyRow" aria-label="특수 키">
        <button data-k="esc">Esc</button><button data-k="tab">Tab</button><button data-k="ctrl" class="wide">Ctrl</button>
        <button data-k="left">←</button><button data-k="down">↓</button><button data-k="up">↑</button><button data-k="right">→</button>
        <button data-k="enter" class="wide">Enter</button>
        <span class="gap"></span>
        <button data-k="alt">Alt</button><button data-k="home">Home</button><button data-k="end">End</button>
        <button data-k="pgup">PgUp</button><button data-k="pgdn">PgDn</button>
        <span class="gap"></span>
        <button data-k="|">|</button><button data-k="~">~</button><button data-k="/">/</button><button data-k="-">-</button>
        <button data-k="paste" class="wide">붙여넣기</button>
      </div>
      <div class="selbar" id="selBar" hidden>
        <span class="sel-hint" id="selHint">복사할 부분을 손가락으로 <b>쭉 그으세요</b></span>
        <button class="btn" id="btnSelCancel">취소</button>
        <button class="btn primary" id="btnSelCopy">복사</button>
      </div>
      <div class="search-bar" id="searchBar" role="search" hidden>
        <span class="sb-ico" data-icon="search"></span>
        <input id="searchInput" placeholder="터미널에서 찾기" aria-label="찾을 글자" spellcheck="false">
        <span class="sb-status" id="searchStatus"></span>
        <button class="icon-btn" id="btnSearchPrev" title="이전 (Shift+Enter)" aria-label="이전" data-icon="chevUp"></button>
        <button class="icon-btn" id="btnSearchNext" title="다음 (Enter)" aria-label="다음" data-icon="chevDown"></button>
        <button class="icon-btn" id="btnSearchClose" title="닫기 (Esc)" aria-label="닫기" data-icon="x"></button>
      </div>
      <div class="zoom-badge" id="zoomBadge" hidden></div>
      <div class="term-empty" id="termEmpty" hidden>
        <p>열린 터미널이 없어요.</p>

(() => {
  if (window.AndroidBridge || new URLSearchParams(location.search).has("mobile")) document.documentElement.classList.add("mobile");
  if (!window.AndroidBridge || window.pywebview) return;
  const pending = new Map();
  let seq = 0;
  window.__bridgeResolve = (id, value) => {
    const done = pending.get(id);
    pending.delete(id);
    if (done) done(value);
  };
  window.pywebview = { api: new Proxy({}, { get: (_, name) => (...args) => new Promise(resolve => {
    const id = ++seq;
    pending.set(id, resolve);
    AndroidBridge.call(String(name), JSON.stringify(args), id);
  }) }) };
  addEventListener("DOMContentLoaded", () => setTimeout(() => dispatchEvent(new Event("pywebviewready")), 0));
})();

const FILE_COLORS = [

const $ = sel => document.querySelector(sel);

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const parentOf = p => p.replace(/\/+$/, "").replace(/\/[^/]*$/, "") || "/";
const joinPath = (dir, name) => (dir === "/" ? "" : dir) + "/" + name;
const baseName = p => p.replace(/\/+$/, "").split("/").pop() || "/";
const shQuote = s => "'" + s.replace(/'/g, "'\\''") + "'";
function fmtSize(n) {
  const units = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return i === 0 ? `${n} B` : `${n.toFixed(n < 10 ? 1 : 0)} ${units[i]}`;
}
function fmtDate(t) {
  const d = new Date(t * 1000), z = v => String(v).padStart(2, "0");
  return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;
}
async function copyText(text) {
  try { if (await api().clipboard_set(text)) return; } catch {}  // Windows 클립보드에 직접 (권한 창 없음)
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
}

/* ================================================================ 대화상자 / 메뉴 / 알림 */
function modal({ title, body = "", input = null, ok = "확인", cancel = "취소", danger = false }) {
  return new Promise(resolve => {
    const root = $("#modal");
    const prevFocus = document.activeElement;
    root.innerHTML = `
      <div class="dialog" role="dialog" aria-modal="true">
        <h3>${esc(title)}</h3>
        <div class="body">${body}</div>
        ${input ? `<input class="field" id="dlgInput" type="${input.secret ? "password" : "text"}" spellcheck="false">
                   <p class="dlg-error">${esc(input.error || "")}</p>` : ""}
        <div class="actions">
          ${cancel ? `<button class="btn" data-act="cancel">${esc(cancel)}</button>` : ""}
          <button class="btn ${danger ? "danger" : "primary"}" data-act="ok">${esc(ok)}</button>
        </div>
      </div>`;
    root.hidden = false;
    const field = $("#dlgInput");
    if (field) {
      field.value = input.value || "";
      field.focus();
      if (input.selectStem && field.value.lastIndexOf(".") > 0) field.setSelectionRange(0, field.value.lastIndexOf("."));
      else field.select();
    } else root.querySelector(danger && cancel ? '[data-act="cancel"]' : '[data-act="ok"]').focus();  // 삭제 같은 건 Enter 로 바로 안 되게

    const close = value => {
      root.hidden = true; root.innerHTML = "";
      document.removeEventListener("keydown", onKey, true);
      if (prevFocus && prevFocus.focus) prevFocus.focus();
      resolve(value);
    };
    const accept = () => close(field ? field.value : true);
    const reject = () => close(field ? null : false);
    const onKey = e => {
      if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); reject(); }
      else if (e.key === "Enter" && !e.isComposing) {
        e.preventDefault();
        e.stopPropagation();
        if (danger && !field) document.activeElement?.closest?.("[data-act]")?.click();  // 위험한 일은 고른 버튼대로
        else accept();
      }
    };
    document.addEventListener("keydown", onKey, true);
    root.onclick = e => {
      const act = e.target.closest("[data-act]")?.dataset.act;
      if (act === "ok") accept();
      else if (act === "cancel" || e.target === root) reject();
    };
  });
}
const listHtml = names => `<div class="list">${names.slice(0, 12).map(esc).join("<br>")}${names.length > 12 ? `<br>… 외 ${names.length - 12}개` : ""}</div>`;

// 메뉴 띄우기: 좌표(x, y) 또는 버튼(anchor)에 붙여서. right = 버튼 오른쪽 끝에 맞춤, above = 버튼 위로
function showMenu(x, y, items, { anchor = null, right = false, above = false } = {}) {
  const menu = $("#menu");
  menu.innerHTML = items.map((it, i) => it === "-" ? "<hr>" :
    `<button data-i="${i}" role="menuitem" class="${it.danger ? "danger" : ""}${it.on ? " on" : ""}">${icon(it.icon, 15)}<span>${esc(it.label)}</span>${it.kbd ? `<span class="kbd">${it.kbd}</span>` : ""}</button>`).join("");
  menu.hidden = false;
  const r = menu.getBoundingClientRect();
  if (anchor) {  // 실제 메뉴 크기를 잰 다음 버튼에 맞춤 (폭을 어림하면 어긋남)
    const a = anchor.getBoundingClientRect();
    x = right ? a.right - r.width : a.left;
    y = above ? a.top - r.height - 6 : a.bottom + 6;
  }
  // 화면 밖으로 나가지 않게 (좌표가 없으면 가운데)
  menu.style.left = Math.max(8, Math.min(Number.isFinite(x) ? x : (innerWidth - r.width) / 2, innerWidth - r.width - 8)) + "px";
  menu.style.top = Math.max(8, Math.min(Number.isFinite(y) ? y : (innerHeight - r.height) / 2, innerHeight - r.height - 8)) + "px";
  const shownAt = performance.now();
  menu.onclick = e => {
    const b = e.target.closest("button[data-i]");
    if (!b || (MOBILE && performance.now() - shownAt < 350)) return;  // 폰: 길게 누른 손가락을 뗄 때 눌리지 않게
    hideMenu();
    items[+b.dataset.i].run();
  };
}
function hideMenu() { $("#menu").hidden = true; }
addEventListener("mousedown", e => { if (!e.target.closest("#menu")) hideMenu(); }, true);
addEventListener("touchstart", e => {
  if ($("#menu").hidden || e.target.closest("#menu")) return;
  hideMenu();
  e.preventDefault();
  e.stopPropagation();
}, { passive: false, capture: true });
// 키보드가 올라오거나 내려가서 화면 크기가 바뀌면 열린 메뉴를 화면 안으로 다시 맞춤
addEventListener("resize", () => {
  const menu = $("#menu");
  if (menu.hidden) return;
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.max(8, Math.min(r.left, innerWidth - r.width - 8)) + "px";
  menu.style.top = Math.max(8, Math.min(r.top, innerHeight - r.height - 8)) + "px";
});
addEventListener("keydown", e => {  // 열린 메뉴는 Esc 로 닫기 (다른 Esc 동작보다 먼저)
  if (e.key === "Escape" && !$("#menu").hidden) { e.preventDefault(); e.stopPropagation(); hideMenu(); }
}, true);
addEventListener("blur", hideMenu);

function toast(message, { error = false, action = null, timeout = 4500 } = {}) {
  const el = document.createElement("div");
  el.className = "toast" + (error ? " err" : "");
  el.innerHTML = `<span class="ic">${icon(error ? "alert" : "check", 17)}</span><span class="msg">${esc(message)}</span>
                  ${action ? `<button class="act">${esc(action.label)}</button>` : ""}`;
  if (action) el.querySelector(".act").onclick = () => {
    if (el.dataset.done) return;  // 두 번 눌려도 한 번만 (되돌리기를 두 번 하면 오류)
    el.dataset.done = "1";
    el.remove();
    action.run();
  };
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), error ? timeout + 3000 : timeout);
}

function setConnecting(on) {
  const btn = $("#btnConnect");
  btn.disabled = on;

  if (on) setPill("busy", "연결하는 중…");

async function connect(password = null, trust = null) {
  stopReconnect();
  const host = $("#host").value.trim(), port = $("#port").value.trim(), user = $("#user").value.trim();
  setLoginMsg("");
  const missing = [["host", "호스트", host], ["port", "포트", port], ["user", "사용자", user]].filter(f => !f[2]);
  document.querySelectorAll("#loginForm .field").forEach(f => f.classList.remove("invalid"));
  if (missing.length) {
    missing.forEach(([id]) => $("#" + id).classList.add("invalid"));
    setLoginMsg(`${missing.map(f => f[1]).join(", ")}을(를) 입력해 주세요.`);
    if (MOBILE) openDrawer();
    $("#" + missing[0][0]).focus();
    return;
  }
  setConnecting(true);
  const r = await api().connect(host, port, user, password, trust);
  setConnecting(false);

  if (r.need === "hostkey") {
    const ok = await modal({
      title: "처음 접속하는 서버예요",
      body: `<p>서버가 보낸 지문이 맞는지 확인하고 계속하세요. 확인하면 다음부터는 묻지 않아요.</p>
             <div class="mono">${esc(r.host)}<br>${esc(r.type)}<br>${esc(r.fingerprint)}</div>`,
      ok: "신뢰하고 연결",
    });
    return ok ? connect(password, r.fingerprint) : showLoggedOut();
  }
  if (r.need === "password") {
    const pw = await modal({
      title: "비밀번호",
      body: `<p>${esc(user)}@${esc(host)} 의 비밀번호를 입력하세요.</p>`,
      input: { secret: true, error: r.retry ? "비밀번호가 틀렸어요. 다시 입력하세요." : "" },
      ok: "연결",
    });
    return pw === null ? showLoggedOut() : connect(pw, trust);
  }
  if (r.error) {
    setLoginMsg(r.error);
    showLoggedOut();
    return;
  }
  onConnected(r);
  state.titlesError = r.titles_error || null;
  if (r.titles_error && !state.titlesErrorShown) {
    state.titlesErrorShown = true;
    toast("탭 이름에 실행 중인 명령을 표시하지 못했어요: " + r.titles_error, { error: true });
  }
  // 처음 연결할 때 알려줄 것들은 알림 하나로 (여러 개가 겹쳐 뜨지 않게)
  const notes = [];
  if (r.used_password) {  // 비밀번호로 들어왔으면 묻지 않고 키 등록 -> 다음부터 비밀번호 없이
    const k = await api().setup_key();
    if (k.error) toast("비밀번호 없이 접속하도록 설정하지 못했어요: " + k.error, { error: true });
    else notes.push("다음부터는 비밀번호 없이 바로 연결돼요.");
  }
  if (r.titles_added) notes.push("서버 탭 이름에 현재 폴더와 실행 중인 명령이 보이게 했어요 (서버 셸 설정에 추가, 원본은 백업).");
  if (notes.length) toast(notes.join(" "), r.titles_added ? { action: { label: "탭 이름 끄기", run: () => setTabTitles(false) }, timeout: 10000 } : {});
}

function showLoggedOut() {
  if (!state.connected) setPill(tabs.some(t => t.kind === "ssh") ? "lost" : "", tabs.some(t => t.kind === "ssh") ? "연결 끊김" : "연결 안 됨");
}

function setLoginMsg(text, info = false) {
  const el = $("#loginError");
  el.textContent = text || "";
  el.classList.toggle("info", !!info);
}

function showSidebar(connected) {
  $("#filesPane").hidden = !connected;
  $("#loginForm").hidden = connected;
  $("#btnEmptySsh").hidden = !connected;
  updateEmpty();
}
function updateEmpty() {
  $("#btnEmptyConnect").hidden = !isAndroid() || state.connected;
}

async function onConnected(r) {
  const sameServer = state.lastLabel === r.label;
  const prevRoot = state.root;
  stopReconnect();
  state.connected = true;
  state.label = state.lastLabel = r.label;
  state.home = r.home;
  setPill("on", r.label);
  showSidebar(true);
  if (MOBILE) closeDrawer();
  startStats();
  const oldTabs = tabs.filter(t => t.kind === "ssh");
  if (sameServer && oldTabs.length) {
    // 연결이 끊겼다가 같은 서버로 다시 붙음: 서버 탭을 화면 내용 그대로 살리고 원래 폴더로
    for (const t of oldTabs) await reviveTab(t);
    if (activeTab) activate(activeTab);
  } else {
    oldTabs.forEach(removeTab);
    await newTab("ssh");
  }
  state.nodes.clear();
  setRoot(sameServer && prevRoot ? prevRoot : r.home);
}

async function reviveTab(tab) {
  const r = await api().term_open(tab.term.cols, tab.term.rows, "ssh");
  if (r.error) return;
  tab.id = r.id;
  tab.term.write("\r\n\x1b[2m── 다시 연결했어요 ──\x1b[0m\r\n");
  // 원래 폴더로: 프롬프트가 뜬 뒤(출력이 잠잠해진 뒤)에 보내야 명령이 두 번 찍히지 않음
  if (tab.cwd && tab.cwd !== "~") tab.pendingCd = `cd ${cdArg(tab.cwd)}\r`;
}

const cdArg = dir => dir === "~" ? "~" : dir.startsWith("~/") ? "~/" + shQuote(dir.slice(2)) : shQuote(dir);

// 끊기면 1, 2, 4, 8, 16, 30초... 간격으로 조용히 다시 연결 (SSH 키가 있으면 비밀번호 없이 됨)
function scheduleReconnect() {
  stopReconnect();
  let left = Math.min(30, 2 ** state.reconnectAttempt);
  state.reconnectAttempt++;
  const tick = () => {
    if (left <= 0) return tryReconnect();
    setPill("lost", `${left}초 뒤 다시 연결`);
    state.bannerText = `서버와 연결이 끊어졌어요 · ${left}초 뒤에 다시 연결해요`;
    updateBanner();
    left--;
  };
  tick();
  state.reconnectTimer = setInterval(tick, 1000);
}

function stopReconnect() {
  clearInterval(state.reconnectTimer);
  state.reconnectTimer = null;
  state.bannerText = null;
}

async function tryReconnect() {
  stopReconnect();
  setPill("busy", "다시 연결하는 중…");
  state.bannerText = "다시 연결하는 중…";
  updateBanner();
  const host = $("#host").value.trim(), port = $("#port").value.trim(), user = $("#user").value.trim();
  const r = await api().connect(host, port, user, null, null);
  if (state.connected) return;  // 그 사이 직접 연결함
  if (r.ok) {
    state.reconnectAttempt = 0;
    await onConnected(r);
    toast("다시 연결했어요.");
  } else if (r.need) {
    // 비밀번호나 서버 확인이 필요하면 자동으로는 못 함 -> 버튼으로
    state.reconnectAttempt = 0;
    setPill("lost", "연결 끊김");
    state.bannerText = null;
    updateBanner();
  } else {
    setLoginMsg(r.error);
    scheduleReconnect();
  }
}

// 절전에서 깨어나거나 네트워크가 돌아오면 기다리지 말고 바로 시도
addEventListener("online", () => { if (state.reconnectTimer) tryReconnect(); });
// 다른 앱(또는 잠자기)에서 돌아오면: 끊겨서 기다리는 중이면 바로 다시 연결, 연결돼 보이면 정말 살아 있는지 확인
let hiddenAt = 0;
document.addEventListener("visibilitychange", async () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (state.reconnectTimer) return tryReconnect();
  if (state.connected && Date.now() - hiddenAt > 8000) {
    let alive = true;
    try { alive = await api().ping(); } catch {}
    if (alive === false && state.connected) onDisconnected();
  }
});

// 서버 탭 이름에 폴더/실행 중인 명령 표시 (기본 켜짐). 켜면 서버 ~/.bashrc 에 몇 줄을 추가함
async function setTabTitles(on) {
  const r = await api().set_tab_titles(on);
  if (r.error) { state.titlesError = r.error; return toast(r.error, { error: true }); }
  state.titlesError = null;
  state.cfg.tab_titles = on;
  toast(on ? "탭 이름 표시를 켰어요. 새로 여는 서버 탭부터 적용돼요."
           : "탭 이름 표시를 껐어요. 서버 ~/.bashrc에서 추가했던 줄을 지웠어요.",
        on ? { action: { label: "새 서버 탭", run: () => newTab("ssh") } } : {});
}

function onDisconnected(message) {
  if (!state.connected) return;
  state.connected = false;
  stopStats();
  setPill("lost", "연결 끊김");
  hideTransfer();
  showSidebar(false);
  if (message) setLoginMsg(message);
  else setLoginMsg("연결이 끊어졌어요. 자동으로 다시 연결하고 있어요.", true);
  renderTabs();
  if (state.lastLabel) scheduleReconnect();
  else updateBanner();
}

async function disconnect() {
  stopReconnect();
  stopStats();
  state.reconnectAttempt = 0;
  state.lastLabel = null;
  await api().disconnect();
  state.connected = false;
  state.nodes.clear();
  state.root = null;
  tabs.filter(t => t.kind === "ssh").forEach(removeTab);  // 내 PC 탭은 그대로 둠
  hideTransfer();
  showSidebar(false);
  setPill("", "연결 안 됨");
  updateBanner();
  if (activeTab) activeTab.term.focus();
}

/* ================================================================ 터미널 탭 */
// 탭마다 자기 화면(xterm)과 서버 셸을 따로 가짐. 다른 탭으로 가도 이전 탭은 그대로 살아 있음.
const tabs = [];     // { key, id, kind: "ssh" | "cmd" | "powershell", term, fit, el, title, unread }
let activeTab = null, tabKeySeq = 0;

const TERM_THEME = {
  background: "#0E1014", foreground: "#D9DEE7", cursor: "#7EA6FF", cursorAccent: "#0E1014",
  selectionBackground: "rgba(110,155,255,0.30)",
  black: "#1B1F27", red: "#FF6B6B", green: "#4ADE9B", yellow: "#F5C26B", blue: "#6EA8FF",
  magenta: "#C99BFF", cyan: "#5DD6E0", white: "#C9D1DC", brightBlack: "#5C6575", brightRed: "#FF8A8A",
  brightGreen: "#7BEBB8", brightYellow: "#FFD68A", brightBlue: "#93BEFF", brightMagenta: "#DDB8FF",
  brightCyan: "#8BE6EE", brightWhite: "#F2F5F9",
};

function defaultKind() {
  if (activeTab && (activeTab.kind !== "ssh" || state.connected)) return activeTab.kind;
  return state.connected || isAndroid() ? "ssh" : "cmd";
}

async function newTab(kind = defaultKind()) {
  if (kind === "ssh" && !state.connected) {
    toast("먼저 왼쪽에서 서버에 연결하세요.");
    if (MOBILE) openDrawer();
    else $("#host").focus();
    return null;
  }
  const el = document.createElement("div");
  el.className = "term-pane";
  $("#termStack").appendChild(el);
  const term = new Terminal({
    fontFamily: getComputedStyle(document.documentElement).getPropertyValue("--mono"),
    fontSize: state.fontSize, lineHeight: 1.2, cursorBlink: true, scrollback: 10000, allowProposedApi: true,
    theme: TERM_THEME,
  });
  const fit = new FitAddon.FitAddon();
  const search = new SearchAddon.SearchAddon();
  term.loadAddon(fit);
  term.loadAddon(search);
  search.onDidChangeResults(({ resultIndex, resultCount }) => {
    if (activeTab && activeTab.search === search && !$("#searchBar").hidden) showSearchCount(resultIndex, resultCount);
  });
  // 주소는 Ctrl+클릭하면 브라우저로 (그냥 클릭은 글자 선택과 헷갈려서)
  term.loadAddon(new WebLinksAddon.WebLinksAddon((e, uri) => { if (e.ctrlKey || e.metaKey) api().open_url(uri); }));
  term.open(el);
  const tab = { key: ++tabKeySeq, fresh: true, id: null, kind, term, fit, search, el, title: "", cwd: null, unread: false, inbuf: "", sending: false };
  tabs.push(tab);
  activate(tab);
  try { fit.fit(); } catch {}

  const r = await api().term_open(term.cols, term.rows, kind);
  if (r.error) {
    removeTab(tab);
    if (kind === "ssh") onDisconnected(r.error);
    else toast("터미널을 열 수 없어요: " + r.error, { error: true });
    return null;
  }
  tab.id = r.id;
  term.onData(d => typeInto(tab, MOBILE ? applyMods(d) : d));
  if (MOBILE) {
    const ta = el.querySelector(".xterm-helper-textarea");
    if (ta) for (const [k, v] of [["autocomplete", "off"], ["autocorrect", "off"], ["autocapitalize", "off"], ["spellcheck", "false"]]) ta.setAttribute(k, v);
  }
  term.onResize(({ cols, rows }) => {
    if (tab.id && isAlive(tab)) api().term_resize(tab.id, cols, rows);
    if (tab === activeTab) updateStatus();
  });
  term.onTitleChange(t => {
    const wasRunning = tab.kind === "ssh" && !!tabInfo(tab).running;
    const same = t === tab.title;
    tab.title = t;
    // 명령이 끝나서 프롬프트로 돌아오면(엔터 뒤 첫 '폴더' 제목, 폴더가 그대로여도) 트리를 새로
    if ((wasRunning || tab.awaitPrompt) && !tabInfo(tab).running && tab === activeTab) { tab.awaitPrompt = false; treeChanged(); }
    if (same) return;
    const cwd = tabInfo(tab).cwd;
    if (cwd && cwd !== tab.cwd) {
      tab.cwd = cwd;
      if (tab === activeTab) followTab(tab);
    }
    renderTabs();
  });
  // Ctrl+C: 선택한 글자가 있으면 복사, 없으면 평소처럼 중단 신호 / Ctrl+V: 붙여넣기
  term.attachCustomKeyEventHandler(e => {
    if (e.type !== "keydown") return true;
    const k = e.key.toLowerCase();
    // 복사: Ctrl+C(선택이 있을 때) / Ctrl+Shift+C / Ctrl+Insert
    if ((e.ctrlKey && k === "c" && (term.hasSelection() || e.shiftKey)) || (e.ctrlKey && !e.shiftKey && e.key === "Insert")) {
      copySelection(tab);
      return false;
    }
    // 붙여넣기: Ctrl+V(브라우저 기본 붙여넣기 -> xterm) / Ctrl+Shift+V / Shift+Insert
    if ((e.ctrlKey && e.shiftKey && k === "v") || (e.shiftKey && !e.ctrlKey && e.key === "Insert")) {
      e.preventDefault();
      pasteClipboard(tab);
      return false;
    }
    if (e.ctrlKey && k === "v") return false;
    // 서버 셸 프롬프트에서는 Home/End/Ctrl+화살표를 어느 셸이든 알아듣는 키로 바꿔 보냄
    // (zsh 기본 설정처럼 Home/End 를 모르는 셸이 많음. vim·less 같은 전체 화면 프로그램 안에서는 그대로)
    if (tab.kind === "ssh" && !e.altKey && !e.metaKey && !e.shiftKey
        && term.buffer.active.type === "normal" && !term.modes.applicationCursorKeysMode) {
      const seq = e.ctrlKey ? { ArrowLeft: "\x1bb", ArrowRight: "\x1bf" }[e.key]
                            : { Home: "\x01", End: "\x05" }[e.key];
      if (seq) {
        e.preventDefault();
        typeInto(tab, seq);
        return false;
      }
    }
    return true;
  });
  renderTabs();
  if (!MOBILE) term.focus();
  return tab;
}

function activate(tab) {
  activeTab = tab;
  tab.unread = false;
  tabs.forEach(t => t.el.classList.toggle("active", t === tab));
  $("#termEmpty").hidden = true;
  renderTabs();
  updateBanner();
  followTab(tab);
  if (!$("#searchBar").hidden) runSearch(1, true);
  requestAnimationFrame(() => { try { tab.fit.fit(); } catch {} if (!MOBILE) tab.term.focus(); });
}

// 트리가 서버 탭의 현재 폴더를 따라감 (탭 이름으로 알게 된 폴더, "~"는 홈 폴더)
function followTab(tab) {
  if (!state.follow || !state.connected || !tab || tab.kind !== "ssh" || !tab.cwd || !state.home) return;
  const dir = tab.cwd === "~" ? state.home : tab.cwd.startsWith("~/") ? joinPath(state.home, tab.cwd.slice(2)) : tab.cwd;
  if (dir.startsWith("/") && dir !== state.root) setRoot(dir);
}

function setFontSize(size) {
  state.fontSize = Math.max(9, Math.min(28, size));
  tabs.forEach(t => { t.term.options.fontSize = state.fontSize; });
  if (activeTab) try { activeTab.fit.fit(); } catch {}
  const badge = $("#zoomBadge");
  badge.textContent = `글자 크기 ${state.fontSize}`;
  badge.hidden = false;
  clearTimeout(setFontSize.timer);
  setFontSize.timer = setTimeout(() => { badge.hidden = true; }, 900);
  clearTimeout(setFontSize.save);
  setFontSize.save = setTimeout(() => api().save_ui({ font_size: state.fontSize }), 500);
  updateStatus();
}
// 숨겨진 탭은 크기를 못 재므로 탭을 바꿀 때 다시 맞춤 (activate 에서 fit)
$("#termStack").addEventListener("wheel", e => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  setFontSize(state.fontSize + (e.deltaY < 0 ? 1 : -1));
}, { passive: false });

/* ---------- 터미널에서 찾기 (Ctrl+Shift+F) ---------- */
function openSearch() {
  if (!activeTab) return;
  const bar = $("#searchBar");
  bar.hidden = false;
  const input = $("#searchInput");
  const sel = activeTab.term.getSelection();
  if (sel && !sel.includes("\n")) input.value = sel;
  input.focus();
  input.select();
  if (input.value) runSearch(1, true);
}
function closeSearch() {
  $("#searchBar").hidden = true;
  tabs.forEach(t => t.search.clearDecorations());
  if (activeTab) { activeTab.term.clearSelection(); activeTab.term.focus(); }
}
const SEARCH_LOOK = {
  decorations: {
    matchBackground: "#24365C", matchBorder: "#24365C", matchOverviewRuler: "#3D5A99",
    activeMatchBackground: "#4F7FF0", activeMatchBorder: "#7EA6FF", activeMatchColorOverviewRuler: "#7EA6FF",
  },
};
function showSearchCount(index, count) {
  const status = $("#searchStatus");
  status.textContent = count ? `${index >= 0 ? index + 1 : "?"}/${count}` : "없음";
  status.classList.toggle("miss", !count);
}
function runSearch(dir, incremental = false) {
  const q = $("#searchInput").value;
  const status = $("#searchStatus");
  if (!activeTab || !q) { status.textContent = ""; status.classList.remove("miss"); activeTab?.search.clearDecorations(); return; }
  const opts = { ...SEARCH_LOOK, incremental };
  const found = dir > 0 ? activeTab.search.findNext(q, opts) : activeTab.search.findPrevious(q, SEARCH_LOOK);
  if (!found) showSearchCount(-1, 0);
}
$("#searchInput").addEventListener("input", () => runSearch(1, true));
$("#searchInput").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); runSearch(e.shiftKey ? -1 : 1); }
  else if (e.key === "Escape") { e.preventDefault(); closeSearch(); }
});
$("#btnSearchNext").onclick = () => runSearch(1);
$("#btnSearchPrev").onclick = () => runSearch(-1);
$("#btnSearchClose").onclick = closeSearch;

// 서버 탭은 연결이 끊기면 죽은 탭이 됨 (내 PC 탭은 상관없음)
const isAlive = tab => tab.kind !== "ssh" || state.connected;

function updateBanner() {
  const dead = activeTab && !isAlive(activeTab);
  $("#termBanner").hidden = !dead;
  if (!dead) return;
  if (state.bannerText) showBanner(state.bannerText, "지금 연결", () => tryReconnect());
  else showBanner("서버와 연결이 끊어졌어요.", "다시 연결", () => connect());
}

function closeTab(tab) {
  if (tab.id && isAlive(tab)) api().term_close(tab.id);
  removeTab(tab);
}

function removeTab(tab) {
  const i = tabs.indexOf(tab);
  if (i < 0) return;
  tabs.splice(i, 1);
  tab.term.dispose();
  tab.el.remove();
  if (activeTab === tab) {
    const next = tabs[i] || tabs[i - 1];
    if (next) activate(next);
    else { activeTab = null; $("#termEmpty").hidden = false; updateBanner(); }
  }
  renderTabs();
}

// 탭 이름: 실행 중인 명령이 있으면 그 명령, 없으면 현재 폴더
function tabInfo(tab) {
  const t = tab.title || "";
  if (tab.kind === "cmd") {
    // cmd.exe는 명령을 실행하는 동안 제목을 "...cmd.exe - 명령"으로 바꿈
    const m = t.match(/\s-\s+(.+)$/);
    return m ? { text: m[1].trim(), running: true } : { text: "명령 프롬프트" };
  }
  if (tab.kind === "powershell") return { text: "PowerShell" };
  if (!t) return { text: "서버" };
  // SSH Lite 서버 설정을 켜면 실행 중일 때 "명령 (사용자@서버: 폴더)"
  let m = t.match(/^(.+) \(([^@\s()]*@[^:\s()]+):\s*(.*)\)$/);
  if (m) return { text: m[1], running: true, where: m[3], cwd: m[3] };
  // bash는 보통 프롬프트에서 "사용자@서버: 폴더"로 알려줌 -> 폴더만
  m = t.match(/^[^@\s]*@[^:\s]+:\s*(.+)$/);
  return m ? { text: m[1], cwd: m[1] } : { text: t };
}

function renderTabs() {
  if (tabDrag && tabDrag.moved) { tabDrag.pending = true; return; }  // 끄는 중엔 놓을 때 한 번에
  const strip = $("#tabs");
  const before = new Map([...strip.querySelectorAll(".tab")].map(el => [el.dataset.key, el.getBoundingClientRect().left]));
  strip.innerHTML = tabs.map((t, i) => {
    const info = tabInfo(t);
    const where = t.kind === "ssh" ? (state.label || "서버") : "내 PC";
    const tip = info.running ? `실행 중: ${info.text}${info.where ? " · " + info.where : ""}` : (t.title || info.text);
    return `
    <div class="tab${t === activeTab ? " active" : ""}${isAlive(t) ? "" : " dead"}${t.kind === "ssh" ? "" : " local"}${info.running ? " running" : ""}${t.fresh ? " entering" : ""}" data-i="${i}" data-key="${t.key}" role="tab" aria-selected="${t === activeTab}"
         title="${esc(where)} · ${esc(tip)}${i < 9 ? ` (Alt+${i + 1})` : ""}">
      <span class="tab-ico">${icon(info.running ? "play" : t.kind === "ssh" ? "server" : "monitor", 14)}</span>
      <span class="tab-title">${esc(info.text)}</span>
      ${t.unread ? '<span class="tab-unread"></span>' : ""}
      <button class="tab-x" data-close="${i}" title="닫기 (Ctrl+Shift+W)">${icon("x", 12)}</button>
    </div>`;
  }).join("");
  tabs.forEach(t => { t.fresh = false; });
  const moved = [];
  strip.querySelectorAll(".tab").forEach(el => {
    const was = before.get(el.dataset.key);
    if (was === undefined) return;
    const dx = was - el.getBoundingClientRect().left;
    if (Math.abs(dx) < 1) return;
    el.style.transition = "none";
    el.style.transform = `translateX(${dx}px)`;
    moved.push(el);
  });

    if (Math.abs(dx) < 5) return;  // 살짝 흔들린 건 클릭
    d.moved = true;
    d.els = [...$("#tabs").querySelectorAll(".tab")];
    d.rects = d.els.map(x => x.getBoundingClientRect());
    d.from = d.to = d.els.indexOf(d.el);

  const shown = Math.max(r[0].left - r[from].left, Math.min(r[r.length - 1].right - r[from].right, dx));
  d.el.style.transform = `translateX(${shown}px)`;

  const center = r[from].left + r[from].width / 2 + dx;

function sendInput(tab, data) {
  if (!tab || !tab.id || !isAlive(tab)) return;
  tab.inbuf += data;
  if (tab.sending) return;
  tab.sending = true;
  (async () => {
    while (tab.inbuf) {
      const chunk = tab.inbuf;
      tab.inbuf = "";
      try { await api().term_input(tab.id, chunk); } catch {}
    }
    tab.sending = false;
  })();
}
