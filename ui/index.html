/* ================================================================ 파일 트리 */
async function setRoot(path) {
  if (path !== state.root) clearFilter(false);  // 다른 폴더로 가면 거르기는 지움
  state.root = path;
  state.selected.clear();
  state.anchor = null;
  const node = getNode(path);
  node.open = true;
  await loadDir(path);
}

function getNode(path) {
  if (!state.nodes.has(path)) state.nodes.set(path, { entries: null, open: false, loading: false });
  return state.nodes.get(path);
}

async function loadDir(path) {
  const node = getNode(path);
  const seq = node.seq = (node.seq || 0) + 1;  // 같은 폴더를 연달아 받을 때 늦게 온 옛 목록이 새 목록을 덮지 않게
  node.loading = true;
  render();
  const r = await api().list_dir(path);
  if (seq !== node.seq) return;
  node.loading = false;
  if (r.error) {
    if (r.disconnected) return onDisconnected();
    node.entries = node.entries || [];
    if (path === state.root && !node.entries.length) node.error = r.error;
    toast(r.error, { error: true });
  } else {
    node.entries = r.entries;
    node.error = null;
  }
  render();
}

async function refreshDir(dir) {
  const targets = [...state.nodes.entries()].filter(([p, n]) => n.entries && (p === dir || dir == null) && (n.open || p === state.root));
  for (const [p] of targets) await loadDir(p);
}

function visible(entries) {
  return state.showHidden ? entries : entries.filter(e => !e.name.startsWith("."));
}

// 거르기: 이름에 글자가 들어 있거나, 펼쳐 둔 폴더 안에 그런 항목이 있으면 보여줌
function makeMatcher() {
  const q = state.filter;
  if (!q) return null;
  const memo = new Map();
  const match = e => {
    if (memo.has(e.path)) return memo.get(e.path);
    let ok = e.name.toLowerCase().includes(q);
    const child = e.dir ? state.nodes.get(e.path) : null;
    if (!ok && child && child.open && child.entries) ok = visible(child.entries).some(match);
    memo.set(e.path, ok);
    return ok;
  };
  return match;
}
function nameHtml(name) {
  const i = state.filter ? name.toLowerCase().indexOf(state.filter) : -1;
  if (i < 0) return esc(name);
  return esc(name.slice(0, i)) + "<mark>" + esc(name.slice(i, i + state.filter.length)) + "</mark>" + esc(name.slice(i + state.filter.length));
}

function render() {
  const tree = $("#tree");
  state.index.clear();
  state.order = [];
  renderCrumbs();
  const root = state.nodes.get(state.root);
  if (!root || (!root.entries && root.loading)) { tree.innerHTML = `<div class="empty">불러오는 중…</div>`; return; }
  if (root.error) { tree.innerHTML = `<div class="empty">${esc(root.error)}</div>`; return; }
  const out = [];
  const match = makeMatcher();
  let hits = 0;
  const walk = (dir, depth) => {
    const node = state.nodes.get(dir);
    if (!node || !node.entries) return;
    const list = match ? visible(node.entries).filter(match) : visible(node.entries);
    if (match) hits += list.filter(e => e.name.toLowerCase().includes(state.filter)).length;
    if (!list.length && depth > 0 && !match) out.push(`<div class="row note" style="--d:${depth}"><span class="chev"></span>비어 있음</div>`);
    for (const e of list) {
      state.index.set(e.path, e);
      state.order.push(e.path);
      const child = e.dir ? state.nodes.get(e.path) : null;
      const open = !!(child && child.open);
      const cls = ["row", e.dir ? "dir" : "", open ? "open" : "", state.selected.has(e.path) ? "sel" : "",
                   state.dropDir === e.path ? "drop" : "", mover.paths && mover.dest === e.path ? "dest" : "",
                   mover.paths && mover.paths.includes(e.path) ? "moving" : ""].join(" ");
      const ico = e.dir ? `<span style="color:var(--folder)">${icon("folder", 16)}</span>`
                        : `<span style="color:${fileColor(e.name)}">${icon("file", 16)}</span>`;
      out.push(`<div class="${cls}" style="--d:${depth}" data-path="${esc(e.path)}" draggable="${MOBILE ? "false" : "true"}"
                 title="${esc(e.name)}${e.dir ? "" : " · " + fmtSize(e.size)}${e.mtime ? " · " + fmtDate(e.mtime) : ""}">
          ${picking ? `<span class="pick">${icon("check", 12)}</span>` : ""}<span class="chev">${e.dir ? icon("chev", 14) : ""}</span>${ico}
          <span class="name">${nameHtml(e.name)}</span>${e.link ? '<span class="link">링크</span>' : ""}
          <span class="meta">${e.dir ? "" : fmtSize(e.size)}</span></div>`);
      if (open) {
        if (child.loading && !child.entries) out.push(`<div class="row note" style="--d:${depth + 1}"><span class="chev"></span>불러오는 중…</div>`);
        else walk(e.path, depth + 1);
      }
    }
  };
  walk(state.root, 0);
  $("#filterCount").textContent = match ? (hits ? `${hits}개` : "없음") : "";
  tree.innerHTML = out.length ? out.join("") : match
    ? `<div class="empty">'${esc(state.filter)}'이(가) 들어간 항목이 없어요</div>`
    : `<div class="empty">빈 폴더예요<br>윈도우 탐색기에서 파일을 끌어다 놓으면 여기로 올라가요</div>`;
  tree.classList.toggle("drop-root", state.dropDir === state.root);
  paintMoveBar();
  paintPickBar();
}

function renderCrumbs() {
  const nav = $("#crumbs");
  if (!state.root) { nav.innerHTML = ""; return; }
  const home = state.home;
  const inHome = home && (state.root === home || state.root.startsWith(home + "/"));
  const parts = [];
  if (inHome) {
    parts.push({ label: "~", path: home });
    let acc = home;
    state.root.slice(home.length).split("/").filter(Boolean).forEach(p => { acc += "/" + p; parts.push({ label: p, path: acc }); });
  } else {
    parts.push({ label: "/", path: "/" });
    let acc = "";
    state.root.split("/").filter(Boolean).forEach(p => { acc += "/" + p; parts.push({ label: p, path: acc }); });
  }
  nav.innerHTML = parts.map((p, i) => `${i > 0 && !(i === 1 && p.label && parts[0].label === "/") ? '<span class="crumb-sep">/</span>' : ""}<button class="crumb${i === parts.length - 1 ? " last" : ""}" data-p="${esc(p.path)}" title="${esc(p.path)}">${esc(p.label)}</button>`).join("");
  nav.scrollLeft = nav.scrollWidth;
}

async function toggleDir(path) {
  const node = getNode(path);
  node.open = !node.open;
  if (node.open && !node.entries) await loadDir(path);
  else {
    render();
    if (node.open) loadDir(path);  // 전에 받아 둔 목록을 바로 보여주고, 뒤에서 최신으로 (터미널에서 바뀐 것 반영)
  }
}

// 서버 탭에서 명령이 끝나면(탭 이름이 '명령 (폴더)' -> '폴더') 트리를 새로: touch·mv·rm 한 결과가 바로 보이게
function treeChanged() {
  clearTimeout(treeChanged.timer);
  treeChanged.timer = setTimeout(() => { if (state.connected && $("#moveBar").hidden) refreshDir(); }, 350);
}

function selectOnly(path) {
  state.selected = new Set([path]);
  state.anchor = path;
  paintSelection();
}

// 선택 표시만 바꿈 (트리를 다시 그리면 더블클릭/끌어다 놓기가 끊기므로)
function paintSelection() {
  tree.querySelectorAll(".row[data-path]").forEach(r => r.classList.toggle("sel", state.selected.has(r.dataset.path)));
}

function selectedEntries() {
  return [...state.selected].map(p => state.index.get(p)).filter(Boolean);
}

function dirOfSelection() {
  const sel = selectedEntries();
  if (sel.length === 1) return sel[0].dir ? sel[0].path : parentOf(sel[0].path);
  return state.root;
}

/* ---------- 파일 작업 ---------- */
// 서버 파일을 내 PC 프로그램으로 열기. 저장하면 파이썬이 알아채서 서버에 다시 올림 (edit_saved 알림)
async function openRemote(entries, choose = false) {
  entries = entries.filter(e => !e.dir).slice(0, 10);
  if (!entries.length) return;
  const big = entries.filter(e => e.size > 50 * 1024 * 1024);
  if (big.length) {
    const ok = await modal({
      title: "큰 파일이에요",
      body: `<p>${esc(big[0].name)} (${fmtSize(big[0].size)})를 받아서 열어요. 시간이 좀 걸릴 수 있어요.</p>`,
      ok: "열기",
    });
    if (!ok) return;
  }
  for (const e of entries) {
    const r = await api().open_remote(e.path, choose);
    if (r.error) {
      toast(`'${e.name}'을(를) 열 수 없어요: ${r.error}`, { error: true });
      if (r.disconnected) onDisconnected();
      return;
    }
  }
  if (isAndroid()) return toast(entries.length === 1 ? `'${entries[0].name}'을(를) 받아서 열었어요 (다운로드/SSH Lite).`
                                                    : `${entries.length}개 파일을 받아서 열었어요 (다운로드/SSH Lite).`);
  toast(entries.length === 1 ? `'${entries[0].name}'을(를) 열었어요. 저장하면 서버에 자동으로 올라가요.`
                             : `${entries.length}개 파일을 열었어요. 저장하면 서버에 자동으로 올라가요.`);
}

async function download(entries, ask = false) {
  if (!entries.length) return;
  let dir = null;
  if (ask) {
    dir = await api().pick_folder();
    if (!dir) return;
  }
  await api().download(entries.map(e => ({ path: e.path, dir: e.dir })), dir);
  showTransferQueued("↓ 다운로드");
}

async function uploadTo(paths, dir) {
  if (!paths.length) return;
  const names = await api().basenames(paths);
  const dup = await api().existing_names(dir, names);
  if (dup.length) {
    const ok = await modal({
      title: "같은 이름이 있어요",
      body: `<p>${esc(baseName(dir))} 폴더에 이미 있는 항목이에요. 덮어쓸까요?</p>${listHtml(dup)}`,
      ok: "덮어쓰기", danger: true,
    });
    if (!ok) return;
  }
  await api().upload(paths, dir);
  showTransferQueued("↑ 업로드");
}

async function pickAndUpload() {
  const dir = dirOfSelection();
  const paths = await api().pick_files();
  await uploadTo(paths, dir);
}

async function newFolder(parent = dirOfSelection()) {
  const name = await modal({ title: "새 폴더", body: `<p>${esc(parent)} 안에 만들어요.</p>`, input: {}, ok: "만들기" });
  if (!name || !name.trim()) return;
  const r = await api().mkdir(parent, name.trim());
  if (r.error) return toast(r.error, { error: true });
  const node = getNode(parent);
  node.open = true;
  await loadDir(parent);
}

async function renameEntry(e) {
  const name = await modal({ title: "이름 바꾸기", input: { value: e.name, selectStem: !e.dir }, ok: "바꾸기" });
  if (!name || !name.trim() || name.trim() === e.name) return;
  const r = await api().rename(e.path, name.trim());
  if (r.error) return toast(r.error, { error: true });
  await loadDir(parentOf(e.path));
}

async function deleteEntries(entries) {  // 지웠으면 true, 취소했으면 false
  if (!entries.length) return false;
  const ok = await modal({
    title: entries.length === 1 ? `'${entries[0].name}'을(를) 삭제할까요?` : `${entries.length}개 항목을 삭제할까요?`,
    body: `<p>서버에서 바로 지워지고 되돌릴 수 없어요. 폴더는 안의 내용까지 지워져요.</p>${listHtml(entries.map(e => e.name + (e.dir ? "/" : "")))}`,
    ok: "삭제", danger: true,
  });
  if (!ok) return false;
  const r = await api().delete(entries.map(e => ({ path: e.path, dir: e.dir, link: e.link })));
  if (r.error) toast(r.error, { error: true });
  const parents = new Set(entries.map(e => parentOf(e.path)));
  entries.forEach(e => state.selected.delete(e.path));
  for (const p of parents) await loadDir(p);
  return true;
}

const movable = (paths, targetDir) => paths.filter(p => parentOf(p) !== targetDir && targetDir !== p && !targetDir.startsWith(p + "/"));
async function moveEntries(paths, targetDir, undoable = true) {
  paths = movable(paths, targetDir);
  if (!paths.length) return;
  const r = await api().move(paths, targetDir);
  for (const p of new Set([...paths.map(parentOf), targetDir])) if (state.nodes.get(p)?.entries) await loadDir(p);
  if (r.error) return toast(r.error, { error: true });
  if (!undoable) return;
  // 잘못 옮겼을 때 바로 되돌릴 수 있게 (원래 있던 폴더별로 다시 옮김)
  const back = new Map();
  for (const p of paths) {
    const from = parentOf(p);
    if (!back.has(from)) back.set(from, []);
    back.get(from).push(joinPath(targetDir, baseName(p)));
  }
  const what = paths.length === 1 ? `'${baseName(paths[0])}'을(를)` : `${paths.length}개를`;
  toast(`${what} '${baseName(targetDir)}' 폴더로 옮겼어요.`, { timeout: 8000, action: { label: "되돌리기", run: async () => {
    for (const [from, now] of back) await moveEntries(now, from, false);
    toast("되돌렸어요.");
  } } });
}

/* 다른 폴더로 옮기기 (폰은 끌기 대신 이것만): 폴더를 누르면 그 폴더가 고른 곳이 되고, 막대의 '여기로 옮기기'로 확정 */
/* 폰: 여러 개 선택. 누를 때마다 체크가 켜지고 꺼지고, 아래 막대에서 옮기기·받기·삭제 */
function startPick(entry) {
  picking = true;
  state.selected = new Set(entry ? [entry.path] : []);
  $("#pickBar").hidden = false;
  render();
}
function endPick(keep = false) {
  if (!picking) return;
  picking = false;
  if (!keep) state.selected.clear();
  $("#pickBar").hidden = true;
  render();
}
function paintPickBar() {
  if (!picking) return;
  const n = selectedEntries().length;
  $("#pickHint").innerHTML = n ? `<b>${n}개</b> 선택했어요 · 더 누르면 추가, 다시 누르면 빠져요` : "고를 항목을 누르세요";
  for (const id of ["#btnPickMove", "#btnPickDownload", "#btnPickDelete"]) $(id).disabled = !n;
}
$("#btnPickCancel").onclick = () => endPick();
$("#btnPickMove").onclick = () => { const sel = selectedEntries(); endPick(true); startMove(sel); };
$("#btnPickDownload").onclick = () => { const sel = selectedEntries(); endPick(); download(sel); };
$("#btnPickDelete").onclick = async () => { if (await deleteEntries(selectedEntries())) endPick(); };  // 취소하면 선택은 그대로

function startMove(entries) {
  mover.paths = entries.map(e => e.path);
  mover.dest = null;
  $("#moveBar").hidden = false;
  render();
}
function endMove() {
  if (!mover.paths) return;
  mover.paths = mover.dest = null;
  $("#moveBar").hidden = true;
  render();
}
function paintMoveBar() {
  if (!mover.paths) return;
  const dest = mover.dest, n = mover.paths.length;
  const ok = !!dest && movable(mover.paths, dest).length > 0;
  const what = n === 1 ? `'${esc(baseName(mover.paths[0]))}'` : `<b>${n}개</b>`;
  $("#moveHint").innerHTML = !dest
    ? `${what}을(를) 옮길 폴더를 누르세요 (맨 위 폴더로 옮기려면 목록 빈 곳을 누르세요)`
    : `${what} → <b>${esc(dest)}</b>${ok ? "" : " (지금 있는 곳이에요)"}`;
  $("#btnMoveHere").disabled = !ok;
}
$("#btnMoveCancel").onclick = endMove;
addEventListener("keydown", e => { if (e.key === "Escape" && mover.paths && $("#modal").hidden && $("#menu").hidden) endMove(); });
$("#btnMoveHere").onclick = async () => {
  const paths = mover.paths, dest = mover.dest;
  if (!dest) return;
  endMove();
  await moveEntries(paths, dest);
};

function openContextMenu(x, y, entry) {
  const sel = selectedEntries();
  const items = [];
  if (entry) {
    const files = sel.filter(x => !x.dir);
    if (files.length) {
      if (isAndroid()) items.push({ icon: "open", label: "폰에서 열기", kbd: "두 번 누르기", run: () => openRemote(files) });
      else items.push({ icon: "edit2", label: "열기 (내 PC에서 편집)", kbd: "더블클릭", run: () => openRemote(files) });
      if (files.length === 1 && !isAndroid()) items.push({ icon: "open", label: "다른 프로그램으로 열기…", run: () => openRemote(files, true) });
      items.push("-");
    }
    items.push({ icon: "download", label: sel.length > 1 ? `${sel.length}개 다운로드` : "다운로드", run: () => download(sel) });
    if (!isAndroid()) items.push({ icon: "open", label: "다른 위치에 다운로드…", run: () => download(sel, true) });
    items.push("-");
    if (sel.length === 1 && entry.dir) {
      items.push({ icon: "terminal", label: "터미널에서 이 폴더로 이동", run: () => cdInTerminal(entry.path) });
      items.push({ icon: "target", label: "이 폴더를 맨 위로 보기", run: () => setRoot(entry.path) });
    }
    items.push({ icon: "upload", label: "여기에 업로드…", run: () => pickAndUpload() });
    items.push({ icon: "folderPlus", label: "새 폴더", run: () => newFolder() });
    if (sel.length === 1) items.push({ icon: "edit", label: "이름 바꾸기", kbd: "F2", run: () => renameEntry(entry) });
    items.push({ icon: "move", label: sel.length > 1 ? `${sel.length}개 다른 폴더로 옮기기…` : "다른 폴더로 옮기기…", run: () => startMove(sel) });
    if (MOBILE && !picking) items.push({ icon: "check", label: "여러 개 선택", run: () => startPick(entry) });
    items.push({ icon: "copy", label: "경로 복사", run: () => copyText(sel.map(e => e.path).join("\n")) });
    items.push("-");
    items.push({ icon: "trash", label: "삭제", kbd: "Del", danger: true, run: () => deleteEntries(sel) });
  } else {
    items.push({ icon: "upload", label: "여기에 업로드…", run: () => pickAndUpload() });
    items.push({ icon: "folderPlus", label: "새 폴더", run: () => newFolder(state.root) });
    items.push({ icon: "terminal", label: "터미널에서 이 폴더로 이동", run: () => cdInTerminal(state.root) });
    items.push({ icon: "refresh", label: "새로고침", kbd: "F5", run: () => refreshDir() });
  }
  showMenu(x, y, items);
}

/* ---------- 트리 마우스 / 키보드 ---------- */
const tree = $("#tree");
const rowPath = el => el?.closest(".row[data-path]")?.dataset.path;

tree.addEventListener("click", e => {
  const path = rowPath(e.target);
  if (!path) {
    if (e.target === tree && mover.paths) { mover.dest = state.root; render(); return; }
    if (e.target === tree) { state.selected.clear(); paintSelection(); }
    return;
  }
  const entry = state.index.get(path);
  if (e.target.closest(".chev") && entry.dir) return toggleDir(path);
  if (picking) {
    state.selected.has(path) ? state.selected.delete(path) : state.selected.add(path);
    state.anchor = path;
    paintSelection();
    paintPickBar();
    return;
  }
  if (mover.paths) {  // 옮기는 중: 폴더를 누르면 그 폴더가 옮길 곳 (파일을 누르면 그 파일이 있는 폴더)
    mover.dest = entry.dir ? path : parentOf(path);
    if (entry.dir && MOBILE && !e.target.closest(".chev")) toggleDir(path);
    render();
    return;
  }
  if (MOBILE) {
    const again = state.selected.size === 1 && state.selected.has(path);
    selectOnly(path);
    if (entry.dir) toggleDir(path);
    else if (again) openRemote([entry]);
    return;
  }
  if (e.ctrlKey || e.metaKey) {
    state.selected.has(path) ? state.selected.delete(path) : state.selected.add(path);
    state.anchor = path;
    paintSelection();
  } else if (e.shiftKey && state.anchor) {
    const a = state.order.indexOf(state.anchor), b = state.order.indexOf(path);
    state.selected = new Set(state.order.slice(Math.min(a, b), Math.max(a, b) + 1));
    paintSelection();
  } else selectOnly(path);
});
tree.addEventListener("dblclick", e => {
  if (MOBILE) return;  // 폰은 위의 누르기로 처리
  const entry = state.index.get(rowPath(e.target));
  if (!entry || e.target.closest(".chev")) return;
  entry.dir ? toggleDir(entry.path) : openRemote([entry]);
});
tree.addEventListener("contextmenu", e => {
  e.preventDefault();
  const path = rowPath(e.target);
  if (picking && path) { state.selected.add(path); paintSelection(); paintPickBar(); }
  else if (path && !state.selected.has(path)) selectOnly(path);
  if (!path && !picking) { state.selected.clear(); paintSelection(); }
  openContextMenu(e.clientX, e.clientY, path ? state.index.get(path) : null);
});
tree.addEventListener("keydown", e => {
  const sel = selectedEntries();
  const cur = state.anchor && state.index.get(state.anchor);
  const move = delta => {
    const i = Math.max(0, Math.min(state.order.length - 1, state.order.indexOf(state.anchor) + delta));
    if (state.order[i]) {
      selectOnly(state.order[i]);
      tree.querySelector(`.row[data-path="${CSS.escape(state.order[i])}"]`)?.scrollIntoView({ block: "nearest" });
    }
  };
  if (e.key === "ArrowDown") { e.preventDefault(); move(state.anchor ? 1 : 0); }
  else if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
  else if (e.key === "ArrowRight" && cur?.dir && !getNode(cur.path).open) toggleDir(cur.path);
  else if (e.key === "ArrowLeft" && cur) {
    if (cur.dir && getNode(cur.path).open) toggleDir(cur.path);
    else if (state.index.has(parentOf(cur.path))) selectOnly(parentOf(cur.path));
  }
  else if (e.key === "Enter" && cur) cur.dir ? toggleDir(cur.path) : openRemote(sel.filter(x => !x.dir));
  else if (e.key === "Delete") deleteEntries(sel);
  else if (e.key === "F2" && sel.length === 1) renameEntry(sel[0]);
  else if (e.key === "Backspace") { e.preventDefault(); goUp(); }
  else if (e.key === "a" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); state.selected = new Set(state.order); paintSelection(); }
  else if (e.key === "Escape" && state.filter) clearFilter();
  else if (e.key.length === 1 && e.key !== " " && !e.ctrlKey && !e.altKey && !e.metaKey) {
    e.preventDefault();
    openFilter(e.key);  // 트리에서 글자를 치면 바로 거르기
  }
});
$("#crumbs").addEventListener("click", e => { const b = e.target.closest(".crumb"); if (b) setRoot(b.dataset.p); });

function goUp() { if (state.root && state.root !== "/") setRoot(parentOf(state.root)); }
$("#btnUp").onclick = goUp;

$("#btnUpload").onclick = pickAndUpload;

function toggleFollow() {
  state.follow = !state.follow;
  api().save_ui({ follow_cwd: state.follow });
  toast(state.follow ? "트리가 서버 탭의 현재 폴더를 따라가요." : "트리 따라가기를 껐어요.", { timeout: 2000 });
  if (state.follow) followTab(activeTab);
  updateStatus();
}
function toggleHidden() {
  state.showHidden = !state.showHidden;
  api().save_ui({ show_hidden: state.showHidden });
  render();
}
$("#btnSideMenu").onclick = e => {
  const anchor = e.currentTarget;
  showMenu(0, 0, [
    { icon: "folderPlus", label: "새 폴더", run: () => newFolder() },
    { icon: "refresh", label: "새로고침", kbd: "F5", run: () => refreshDir() },
    "-",
    { icon: state.showHidden ? "check" : "eye", on: state.showHidden, label: "숨김 파일 보기", run: toggleHidden },
    { icon: state.follow ? "check" : "link", on: state.follow, label: "터미널 폴더 따라가기", run: toggleFollow },
  ], { anchor, right: true });
};
$("#sbFollow").onclick = toggleFollow;
$("#sbFont").onclick = e => {
  showMenu(0, 0, [
    { icon: "plus", label: "글자 크게", kbd: MOBILE ? "" : "Ctrl+=", run: () => setFontSize(state.fontSize + 1) },
    { icon: "chevDown", label: "글자 작게", kbd: MOBILE ? "" : "Ctrl+-", run: () => setFontSize(state.fontSize - 1) },
    { icon: "refresh", label: "원래 크기", kbd: MOBILE ? "" : "Ctrl+0", run: () => setFontSize(MOBILE ? 13 : 14) },
  ], { anchor: e.currentTarget, right: true, above: true });
};

/* 단축키 · 사용법 (⋯ 메뉴, F1). 폰은 손가락 동작으로 */
function showHelp() {
  const table = rows => `<table class="help">${rows.map(r => r === "-" ? '<tr class="sep"><td colspan="2"></td></tr>'
    : `<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join("")}</table>`;
  const pc = [
    ["Ctrl+Shift+T", "같은 종류 탭 하나 더"], ["Ctrl+Shift+W", "탭 닫기"],

// 탐색기 -> 앱: 놓을 폴더를 여기서 정해두고, 실제 파일 경로는 파이썬이 'dropped' 이벤트로 알려줌
// 앱 안에서: 트리 항목을 다른 폴더 위에 놓으면 이동
let dragInternal = null, lastDropDir = null;
const isFileDrag = e => [...(e.dataTransfer?.types || [])].includes("Files");

tree.addEventListener("dragstart", e => {
  if (MOBILE || mover.paths) { e.preventDefault(); return; }
  const path = rowPath(e.target);
  if (!path) return;
  if (!state.selected.has(path)) selectOnly(path);
  dragInternal = [...state.selected];
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", dragInternal.join("\n"));
});
tree.addEventListener("dragend", () => { dragInternal = null; setDropDir(null); });

function dropDirFor(target) {
  if (!state.connected || !state.root) return null;
  const path = rowPath(target);
  if (path) {
    const entry = state.index.get(path);
    return entry.dir ? entry.path : parentOf(entry.path);
  }
  return state.root;  // 빈 곳이나 터미널 위에 놓으면 지금 보고 있는 맨 위 폴더로
}
function setDropDir(dir) {
  if (state.dropDir === dir) return;
  state.dropDir = dir;
  $("#dropHint").hidden = !dir || !!dragInternal;
  if (dir) $("#dropHintPath").textContent = dir;
  tree.querySelectorAll(".row.drop").forEach(r => r.classList.remove("drop"));
  if (dir && dir !== state.root) tree.querySelector(`.row[data-path="${CSS.escape(dir)}"]`)?.classList.add("drop");
  tree.classList.toggle("drop-root", dir === state.root);
}
document.addEventListener("dragover", e => {
  if (!isFileDrag(e) && !dragInternal) return;
  e.preventDefault();
  const dir = dropDirFor(e.target);
  e.dataTransfer.dropEffect = !dir ? "none" : dragInternal ? "move" : "copy";
  setDropDir(dir);
});
document.addEventListener("dragleave", e => { if (!e.relatedTarget) setDropDir(null); });
document.addEventListener("drop", e => {
  e.preventDefault();
  const dir = state.dropDir;
  setDropDir(null);
  if (dragInternal) { const paths = dragInternal; dragInternal = null; if (dir) moveEntries(paths, dir); return; }
  lastDropDir = dir;
}, true);

function openFilter(initial) {
  const input = $("#filterInput");
  if (initial != null) input.value = (state.filter ? input.value : "") + initial;
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
  applyFilter();
}
function applyFilter() {
  state.filter = $("#filterInput").value.trim().toLowerCase();
  $("#btnFilterClose").hidden = !$("#filterInput").value;
  render();
}
function clearFilter(redraw = true) {
  const had = !!state.filter || !!$("#filterInput").value;
  state.filter = "";
  $("#filterInput").value = "";
  $("#btnFilterClose").hidden = true;
  if (redraw && had) render();
  if (redraw) $("#tree").focus();
}
$("#filterInput").addEventListener("input", applyFilter);
$("#filterInput").addEventListener("keydown", e => {
  if (e.key === "Escape") { e.preventDefault(); clearFilter(); }
  else if (e.key === "ArrowDown" || e.key === "Enter") {
    // 첫 번째로 맞는 항목을 골라서 트리로 (Enter 는 파일이면 바로 열기)
    e.preventDefault();
    const first = state.order.find(p => state.index.get(p).name.toLowerCase().includes(state.filter)) || state.order[0];
    if (!first) return;
    selectOnly(first);

    if (e.key === "Enter" && !entry.dir) openRemote([entry]);
  }
});
$("#btnFilterClose").onclick = () => clearFilter();

/* ---------- 서버 사용량 (상태 줄) ---------- */
let statsTimer = null, statsGen = 0, lastStats = null;
function startStats() {
  stopStats();
  if (state.cfg.server_stats === false) return;
  const gen = ++statsGen;
  const box = $("#sbStats");
  box.innerHTML = '<span class="stat">사용량 읽는 중…</span>';
  box.hidden = false;
  const tick = async (next) => {
    if (gen !== statsGen || !state.connected) return;
    let r;
    try { r = await api().server_stats(); } catch (e) { r = { error: String(e) }; }
    if (gen !== statsGen || !state.connected) return;
    showStats(r);
    // 못 읽으면 30초 뒤 다시 (서버가 잠깐 바빴을 수 있음)
    statsTimer = setTimeout(() => tick(10000), r.error ? 30000 : next);
  };
  tick(2500);  // CPU 는 두 번째부터 나오는 서버가 있어서 처음엔 금방 한 번 더
}
function stopStats() {
  statsGen++;
  clearTimeout(statsTimer);
  statsTimer = null;
  $("#sbStats").hidden = true;
  $("#sbUptime").hidden = true;
}
function showStats(r) {
  lastStats = r;
  const box = $("#sbStats");
  if (r.error) {
    box.innerHTML = '<button class="stat stat-err" id="btnStatsErr" title="눌러서 이유 보기">사용량 ⚠</button>';
    $("#btnStatsErr").onclick = showStatsError;
    box.hidden = false;
    return;
  }
  const level = pct => pct >= 90 ? " hot" : pct >= 75 ? " warm" : "";
  const meter = pct => `<span class="meter"><i style="width:${pct || 0}%"></i></span>`;
  const html = [], tips = [];
  html.push(`<span class="stat${level(r.cpu)}" title="${r.cpu == null ? "CPU 재는 중" : `CPU ${r.cpu}%`}"><span class="k">CPU</span> <span class="v">${r.cpu == null ? "…" : r.cpu + "%"}</span>${meter(r.cpu)}</span>`);
  if (r.mem_total) {
    const pct = Math.round(r.mem_used / r.mem_total * 100), tip = `메모리 ${fmtSize(r.mem_used)} / ${fmtSize(r.mem_total)} 사용 중 (${pct}%)`;
    tips.push(tip);
    html.push(`<span class="stat${level(pct)}" title="${esc(tip)}"><span class="k">메모리</span> <span class="v">${fmtUsed(r.mem_used, r.mem_total, 1024)}</span>${meter(pct)}</span>`);
  }
  if (r.disk_total) {
    const tip = `디스크 ${fmtUsed(r.disk_used, r.disk_total, 1000)} 사용 중 (${r.disk_pct}%, ${r.mount})`;
    tips.push(tip);
    const hiddenX = MOBILE ? (r.xdisks || []).length : Math.max(0, (r.xdisks || []).length - 2);  // PC 상태 줄엔 2개까지
    const more = hiddenX ? `<span class="xmore" title="외장 디스크 ${hiddenX}개 더: 눌러서 보기" aria-label="외장 디스크 ${hiddenX}개 더"></span>` : "";
    html.push(`<span class="stat${level(r.disk_pct)}" title="${esc(tip)}"><span class="k">디스크</span> <span class="v">${fmtUsed(r.disk_used, r.disk_total, 1000)}</span>${more}${meter(r.disk_pct)}</span>`);
  }
  for (const x of (r.xdisks || []).slice(0, 2)) {  // 외장 디스크 (맥 /Volumes, 리눅스 /media·/mnt). 폰은 자리가 없어서 눌렀을 때 창에서
    const tip = `외장 디스크 ${x.name}: ${fmtUsed(x.used, x.total, 1000)} 사용 중 (${x.pct}%, ${x.mount})`;
    tips.push(tip);
    html.push(`<span class="stat xd${level(x.pct)}" title="${esc(tip)}"><span class="k">${esc(x.name)}</span> <span class="v">${fmtUsed(x.used, x.total, 1000)}</span>${meter(x.pct)}</span>`);
  }
  if (r.net_in != null) {
    html.push(`<span class="stat opt" title="서버 네트워크: 받는 속도 / 보내는 속도"><span class="net-down">↓</span> <span class="v">${fmtSize(r.net_in)}/s</span> <span class="net-up">↑</span> <span class="v">${fmtSize(r.net_out)}/s</span></span>`);
  }
  const up = $("#sbUptime");
  up.textContent = r.uptime != null ? `가동 ${fmtUptime(r.uptime)}` : "";
  up.title = "서버가 켜진 지";
  up.hidden = r.uptime == null;
  box.innerHTML = html.join("");
  box.title = tips.join("  ·  ");
  box.hidden = false;
}
// '사용 / 전체 단위' 한 단위로 짧게: 27.5/32 GB, 135/245 GB, 1.2/2 TB
// 메모리는 1024 단위(32GB 램 = 32 GB), 디스크는 1000 단위(맥 Finder·디스크 제품 표기와 같게)
function fmtUsed(used, total, base) {
  const units = ["B", "KB", "MB", "GB", "TB", "PB"];
  let i = 0;
  while (total >= base * 0.95 && i < units.length - 1) { total /= base; used /= base; i++; }
  const num = v => v >= 100 ? Math.round(v) : v > 0 && v < 0.1 ? +v.toFixed(2) : +v.toFixed(1);
  return `${num(used)}/${num(total)} ${units[i]}`;
}
// 상태 줄 사용량을 누르면: 전부 자세히 (폰에서는 외장 디스크를 여기서 봄)
function showStatsDetail() {
  const r = lastStats;
  if (!r || r.error) return;
  const row = (k, v, pct, sub, pctText = true) => `<div class="sd-row"><span class="sd-k">${esc(k)}</span><span class="sd-v${pct == null ? " wide" : ""}">${esc(v)}</span>
    ${pct != null ? `<span class="sd-bar${pct >= 90 ? " hot" : pct >= 75 ? " warm" : ""}"><i style="width:${pct}%"></i></span><span class="sd-pct">${pctText ? pct + "%" : ""}</span>` : ""}
    ${sub ? `<span class="sd-sub">${esc(sub)}</span>` : ""}</div>`;
  const rows = [];
  if (r.cpu != null) rows.push(row("CPU", `${r.cpu}%`, r.cpu, "", false));
  if (r.mem_total) rows.push(row("메모리", fmtUsed(r.mem_used, r.mem_total, 1024), Math.round(r.mem_used / r.mem_total * 100)));
  if (r.disk_total) rows.push(row("디스크", fmtUsed(r.disk_used, r.disk_total, 1000), r.disk_pct, "내장 · " + r.mount));
  for (const x of r.xdisks || []) rows.push(row(x.name, fmtUsed(x.used, x.total, 1000), x.pct, "외장 · " + x.mount));
  if (r.net_in != null) rows.push(row("네트워크", `↓ ${fmtSize(r.net_in)}/s  ↑ ${fmtSize(r.net_out)}/s`));
  if (r.uptime != null) rows.push(row("가동 시간", fmtUptime(r.uptime)));
  if (!(r.xdisks || []).length) rows.push(`<p class="sd-note">외장 디스크를 연결하면 여기와 상태 줄에 같이 나와요.</p>`);
  modal({ title: "서버 사용량", body: `<div class="sd">${rows.join("")}</div>`, ok: "닫기", cancel: null });
}
$("#sbStats").addEventListener("click", e => { if (!e.target.closest("#btnStatsErr")) showStatsDetail(); });
function fmtUptime(sec) {
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  return d ? `${d}일 ${h}시간` : h ? `${h}시간 ${m}분` : `${m}분`;
}
function showStatsError() {
  const r = lastStats || {};
  modal({
    title: "서버 사용량을 읽지 못했어요",
    body: `<p>${esc(r.error || "")}</p>
           <p>서버가 보낸 내용이에요. 이 화면을 캡처해서 보내주시면 고칠 수 있어요.</p>
           <div class="list" style="white-space: pre-wrap; max-height: 260px">${esc(r.detail || "(아무것도 오지 않았어요)")}</div>`,
    ok: "다시 시도", cancel: "닫기",
  }).then(ok => { if (ok) startStats(); });
}
async function toggleStats() {

// 전송 속도: 최근 속도에 무게를 두고 부드럽게 (숫자가 너무 튀지 않게)
function fmtEta(sec) {
  if (!isFinite(sec) || sec < 0) return "";
  if (sec < 60) return `${Math.max(1, Math.round(sec))}초 남음`;
  if (sec < 3600) return `${Math.round(sec / 60)}분 남음`;
  return `${Math.floor(sec / 3600)}시간 ${Math.round((sec % 3600) / 60)}분 남음`;
}

/* ================================================================ 파이썬에서 오는 알림 */
window.app = {
  onEvent({ type, data }) {
    switch (type) {
      case "term": {
        const tab = tabs.find(t => t.id === data.id);
        if (!tab) break;
        tab.term.write(data.data);
        if (tab.pendingCd) {
          clearTimeout(tab.pendingTimer);
          tab.pendingTimer = setTimeout(() => { sendInput(tab, tab.pendingCd); tab.pendingCd = null; }, 300);
        }
        if (tab !== activeTab && !tab.unread) { tab.unread = true; renderTabs(); }
        break;
      }
      case "term_closed": {  // exit 등으로 셸이 끝나면 그 탭을 닫음
        const tab = tabs.find(t => t.id === data.id);
        if (tab) removeTab(tab);
        break;
      }
      case "disconnected":
        onDisconnected();
        break;
      case "transfer": {
        const kind = data.kind === "upload" ? "↑ 업로드" : "↓ 다운로드";
        if (!state.transfer) showTransferQueued(kind);
        $("#tKind").textContent = kind;
        $("#tName").textContent = data.label;
        const pct = data.all ? (data.done / data.all) * 100 : 100;  // 이번 전송 전체 기준
        $("#tBar").style.width = pct.toFixed(1) + "%";
        $("#tBytes").textContent = `${Math.floor(pct)}%  ·  ${fmtSize(data.done)} / ${fmtSize(data.all)}`;
        const t = state.transfer, now = performance.now() / 1000;
        if (t.at == null || data.done < t.doneAt) { t.at = now; t.doneAt = data.done; t.speed = 0; t.start = now; }
        else if (now - t.at >= 0.4) {
          const inst = (data.done - t.doneAt) / (now - t.at);
          t.speed = t.speed ? t.speed * 0.7 + inst * 0.3 : inst;
          t.at = now;
          t.doneAt = data.done;
        }
        $("#tSpeed").textContent = t.speed > 0
          ? `${fmtSize(t.speed)}/s  ·  ${fmtEta((data.all - data.done) / t.speed)}` : "속도 재는 중…";
        $("#tCount").textContent = (data.total > 1 ? `${data.index}/${data.total}개` : "") + (data.queued ? `  ·  대기 ${data.queued}` : "");
        break;
      }
      case "transfer_done":
        hideTransfer();
        if (data.kind === "upload") {
          toast(`${data.count}개 파일을 올렸어요 → ${baseName(data.dir)}`);
          refreshDir(data.dir);
        } else {
          toast(`${data.count}개 파일을 받았어요`, { action: { label: "폴더 열기", run: () => api().show_in_explorer(data.first) } });
        }
        break;
      case "transfer_cancelled":
        hideTransfer();
        toast("전송을 취소했어요.");
        if (data.kind === "upload") refreshDir(data.dir);
        break;
      case "transfer_error":
        hideTransfer();
        toast(data.error, { error: true });
        if (data.disconnected) onDisconnected();
        else if (data.kind === "upload") refreshDir(data.dir);
        break;
      case "edit_saved":
        toast(`'${data.name}' 저장 → 서버에 올렸어요.`, { timeout: 2500 });
        refreshDir(parentOf(data.remote));
        break;
      case "edit_waiting":
        toast(`'${data.name}' 저장한 내용은 서버에 다시 연결되면 올릴게요.`);
        break;
      case "close_blocked":
        modal({
          title: "아직 끝나지 않은 일이 있어요",
          body: `<p>지금 닫으면 아래 일이 사라져요.</p>${listHtml(data.reasons)}`,
          ok: "그래도 닫기", cancel: "계속 쓰기", danger: true,
        }).then(ok => { if (ok) api().force_close(); });
        break;
      case "edit_error":
        toast(`'${data.name}'을(를) 서버에 올리지 못했어요: ${data.error}`, { error: true });
        break;
      case "dropped":
        if (state.connected) uploadTo(data.paths, lastDropDir || state.root);
        break;
    }
  },
};

/* ================================================================ 기타 화면 동작 */
$("#loginForm").addEventListener("submit", e => { e.preventDefault(); connect(); });

// ⋯ 메뉴: 설정과 자주 안 쓰는 것만. 새 탭은 + 버튼, 글자 크기는 상태 줄 오른쪽 끝(폰은 두 손가락)
$("#btnMenu").onclick = e => {

};

// 왼쪽 패널 폭 조절
(() => {
  const split = $("#splitter");
  split.addEventListener("mousedown", e => {
    e.preventDefault();
    split.classList.add("drag");
    const move = ev => {
      const w = Math.max(220, Math.min(innerWidth * 0.45, ev.clientX));
      document.documentElement.style.setProperty("--side-w", w + "px");
    };

      split.classList.remove("drag");
      removeEventListener("mousemove", move);
      removeEventListener("mouseup", up);
      api().save_ui({ sidebar_width: Math.round(Math.max(220, Math.min(innerWidth * 0.45, ev.clientX))) });

    addEventListener("mouseup", up);
  });
})();

let booted = false;
/* ================= 폰: 서랍 · 키 줄 · 두 손가락 글자 크기 · 뒤로 가기 ================= */
const drawerOpen = () => document.documentElement.classList.contains("drawer-open");
function openDrawer() {
  if (!MOBILE) return;
  document.documentElement.classList.add("drawer-open");
  document.activeElement?.blur?.();  // 키보드 내리기
}
function closeDrawer() { document.documentElement.classList.remove("drawer-open"); }
$("#btnDrawer").onclick = () => drawerOpen() ? closeDrawer() : openDrawer();
$("#drawerBackdrop").onclick = closeDrawer;

/* 터치가 시작된 요소가 손가락을 대고 있는 사이 지워지면(트리 새로고침, 터미널 출력으로 다시 그려짐)
   그 뒤의 움직임·손 떼기가 window 까지 올라오지 않음 -> 서랍이 끌던 자리에 멈추던 원인.
   시작한 요소 자체에 붙여서 끝까지 받음 */
function followTouch(target, onMove, onEnd) {
  const opts = { passive: false };
  const stop = ev => {
    target.removeEventListener("touchmove", onMove, opts);
    target.removeEventListener("touchend", stop);
    target.removeEventListener("touchcancel", stop);
    onEnd(ev);
  };
  target.addEventListener("touchmove", onMove, opts);
  target.addEventListener("touchend", stop);
  target.addEventListener("touchcancel", stop);
}

// 손가락으로 오른쪽으로 밀면 서랍이 따라 나오고, 서랍을 왼쪽으로 밀면 들어감 (세로로 밀면 평소처럼 스크롤)
if (MOBILE) {
  const side = $("#sidebar"), back = $("#drawerBackdrop");
  let g = null;
  addEventListener("touchstart", e => {
    if (g && g.started) end();  // 지난번 끌기가 어떤 이유로든 안 끝났으면 먼저 제자리로
    g = null;
    if (e.touches.length !== 1 || !$("#modal").hidden || !$("#menu").hidden) return;
    const t = e.touches[0];
    const open = drawerOpen();
    if (open ? !(side.contains(e.target) || e.target === back) : (t.clientX > innerWidth * 0.6 || e.target.closest("#keyRow, #tabbar, .statusbar"))) return;
    g = { x: t.clientX, y: t.clientY, open, started: false, last: t.clientX, t: performance.now(), v: 0 };
    followTouch(e.target, move, end);
  }, { passive: true });
  function move(e) {
    if (!g) return;
    const t = e.touches[0], dx = t.clientX - g.x, dy = t.clientY - g.y;
    if (!g.started) {
      if (Math.abs(dx) < 14 && Math.abs(dy) < 14) return;
      // 옆으로 확실히 밀 때만 서랍 (위아래 스크롤하다 조금 비껴도 서랍이 딸려 오지 않게)
      if (Math.abs(dx) < Math.abs(dy) * 1.6 || (g.open ? dx > 0 : dx < 0)) { g = null; return; }
      g.started = true;
      side.classList.add("dragging");
      back.classList.add("dragging");
      document.documentElement.classList.add("drawer-open");
    }
    e.preventDefault();
    const w = side.offsetWidth, now = performance.now();
    g.v = (t.clientX - g.last) / Math.max(1, now - g.t);
    g.last = t.clientX;
    g.t = now;
    const x = Math.max(-w, Math.min(0, g.open ? dx : -w + dx));
    side.style.transform = `translateX(${x}px)`;
    back.style.opacity = String(1 + x / w);
  }
  function end() {
    if (!g || !g.started) { g = null; return; }
    const w = side.offsetWidth;
    const x = parseFloat((side.style.transform.match(/-?[\d.]+/) || [0])[0]);
    side.classList.remove("dragging");
    back.classList.remove("dragging");
    side.style.transform = back.style.opacity = "";
    const open = g.v > 0.35 ? true : g.v < -0.35 ? false : x > -w / 2;  // 빠르게 밀면 방향대로
    open ? openDrawer() : closeDrawer();
    g = null;
  }

  // 두 손가락으로 벌리거나 오므리면 터미널 글자 크기
  let pinch = null;
  const dist = ts => Math.hypot(ts[0].clientX - ts[1].clientX, ts[0].clientY - ts[1].clientY);
  $("#termStack").addEventListener("touchstart", e => {
    if (e.touches.length === 2) pinch = { d: dist(e.touches), size: state.fontSize };
  }, { passive: true });
  $("#termStack").addEventListener("touchmove", e => {
    if (!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    const size = Math.round(pinch.size * dist(e.touches) / pinch.d);
    if (size !== state.fontSize) setFontSize(size);
  }, { passive: false });
  $("#termStack").addEventListener("touchend", e => { if (e.touches.length < 2) pinch = null; });
}

if (MOBILE) {
  const stack = $("#termStack");
  let fling = null, tr = null;
  const stopFling = () => { if (fling) cancelAnimationFrame(fling.raf); fling = null; };
  stack.addEventListener("touchstart", e => {
    stopFling();
    tr = null;
    if (e.touches.length !== 1 || !activeTab || sel.tab) return;
    const y = e.touches[0].clientY;
    tr = { y, t: performance.now(), v: 0 };
    followTouch(e.target, ev => {
      if (!tr || ev.touches.length !== 1) return;
      const ny = ev.touches[0].clientY, now = performance.now();
      const v = (tr.y - ny) / Math.max(1, now - tr.t);  // 화면 위로 미는 속도 (px/ms)
      tr.v = tr.v * 0.6 + v * 0.4;
      tr.y = ny;
      tr.t = now;
    }, () => {
      const tab = activeTab, v0 = tr ? tr.v : 0;
      tr = null;
      if (!tab || Math.abs(v0) < 0.5 || performance.now() - (termPress.shownAt || 0) < 600) return;
      if (tab.term.buffer.active.type !== "normal") return;  // vim·less 같은 전체 화면 프로그램 안에서는 안 함
      const rowPx = tab.el.querySelector(".xterm-screen").getBoundingClientRect().height / tab.term.rows;
      fling = { v: v0, acc: 0, last: performance.now() };
      const step = now => {
        if (!fling) return;
        const dt = now - fling.last;
        fling.last = now;
        fling.acc += fling.v * dt;
        const lines = Math.trunc(fling.acc / rowPx);
        if (lines) { tab.term.scrollLines(lines); fling.acc -= lines * rowPx; }
        fling.v *= Math.pow(0.96, dt / 16);  // 손을 뗀 뒤 점점 느려짐
        if (Math.abs(fling.v) < 0.05) return stopFling();
        fling.raf = requestAnimationFrame(step);
      };
      fling.raf = requestAnimationFrame(step);
    });
  }, { passive: true });
}

// 폰 키보드에 없는 키 (Ctrl·Alt 는 한 번 누르면 다음 글자 하나에 붙음)
const mods = { ctrl: false, alt: false };
function paintMods() {
  for (const k of ["ctrl", "alt"]) $(`#keyRow [data-k="${k}"]`).classList.toggle("on", mods[k]);
}
function applyMods(d) {
  if (!mods.ctrl && !mods.alt) return d;
  let out = d;
  if (mods.ctrl && d.length === 1) {
    const c = d.toLowerCase();
    if (c >= "a" && c <= "z") out = String.fromCharCode(c.charCodeAt(0) - 96);
    else if (c === " " || c === "@") out = "\x00";
    else if ("[\\]^_".includes(c)) out = String.fromCharCode(c.charCodeAt(0) - 64);
    else if (c === "?") out = "\x7f";
  }
  if (mods.alt) out = "\x1b" + out;
  mods.ctrl = mods.alt = false;
  paintMods();
  return out;
}
function keySeq(tab, k) {
  const app = tab.term.modes.applicationCursorKeysMode;
  const atPrompt = tab.kind === "ssh" && tab.term.buffer.active.type === "normal" && !app;
  const arrow = c => (mods.ctrl ? "\x1b[1;5" : app ? "\x1bO" : "\x1b[") + c;
  switch (k) {
    case "esc": return "\x1b";
    case "tab": return "\t";
    case "enter": return "\r";
    case "up": return arrow("A");
    case "down": return arrow("B");
    case "right": return mods.ctrl && atPrompt ? "\x1bf" : arrow("C");
    case "left": return mods.ctrl && atPrompt ? "\x1bb" : arrow("D");
    case "home": return atPrompt ? "\x01" : app ? "\x1bOH" : "\x1b[H";  // 셸 프롬프트에서는 어느 셸이든 아는 키로
    case "end": return atPrompt ? "\x05" : app ? "\x1bOF" : "\x1b[F";
    case "pgup": return "\x1b[5~";
    case "pgdn": return "\x1b[6~";
    default: return k;
  }
}
(() => {
  const row = $("#keyRow");
  // 터치는 직접 처리: 기본 동작(포커스 이동)을 막아야 터미널 입력칸이 포커스를 잃지 않음 = 키보드가 닫히지 않음.
  // 그래서 줄을 옆으로 미는 스크롤도 직접 함
  let t = null;
  const press = b => {
    try { window.AndroidBridge?.tap?.(); } catch {}  // 아주 짧은 진동 (눌렸다는 느낌)
    const k = b.dataset.k;
    if (k === "ctrl" || k === "alt") { mods[k] = !mods[k]; paintMods(); return; }
    const tab = activeTab;
    if (!tab || !tab.id) return;
    if (k === "paste") { pasteClipboard(tab); return; }
    const seq = keySeq(tab, k);
    typeInto(tab, k.length === 1 ? applyMods(seq) : (mods.alt && !["up", "down", "left", "right"].includes(k) ? "\x1b" : "") + seq);
    if (k.length > 1 && (mods.ctrl || mods.alt)) { mods.ctrl = mods.alt = false; paintMods(); }
  };
  const REPEAT = new Set(["left", "right", "up", "down", "pgup", "pgdn"]);
  const stopRepeat = () => { if (t) { clearTimeout(t.hold); clearInterval(t.rep); } };
  row.addEventListener("touchstart", e => {
    e.preventDefault();
    const b = e.target.closest("button");
    t = { x: e.touches[0].clientX, left: row.scrollLeft, b, moved: false, repeated: false };
    if (b) b.classList.add("press");
    if (b && REPEAT.has(b.dataset.k)) {  // 0.4초 넘게 누르고 있으면 계속 보냄
      const tt = t;
      tt.hold = setTimeout(() => {
        if (tt.moved) return;
        tt.repeated = true;
        press(b);
        tt.rep = setInterval(() => press(b), 70);
      }, 400);
    }
  }, { passive: false });
  row.addEventListener("touchmove", e => {
    if (!t) return;
    const dx = e.touches[0].clientX - t.x;
    if (Math.abs(dx) > 8 && !t.repeated) {
      t.moved = true;
      stopRepeat();
      if (t.b) t.b.classList.remove("press");
    }
    if (t.moved) row.scrollLeft = t.left - dx;
  }, { passive: true });
  row.addEventListener("touchend", () => {
    if (!t) return;
    stopRepeat();
    if (t.b) t.b.classList.remove("press");
    if (t.b && !t.moved && !t.repeated) press(t.b);
    t = null;
  });
  row.addEventListener("touchcancel", () => { stopRepeat(); if (t && t.b) t.b.classList.remove("press"); t = null; });
  // 마우스(PC 에서 확인할 때)
  row.addEventListener("mousedown", e => e.preventDefault());
  row.addEventListener("click", e => { const b = e.target.closest("button"); if (b && e.detail !== -1) press(b); });
  row.addEventListener("contextmenu", e => e.preventDefault());
})();

// 안드로이드 뒤로 가기: 열린 것부터 닫음. 닫을 게 없으면 false (앱은 뒤로 숨기만 하고 연결은 유지)
window.__onBack = () => {
  if (!$("#modal").hidden) { $("#modal").click(); return true; }  // 바깥 누르기 = 취소
  if (!$("#menu").hidden) { hideMenu(); return true; }
  if (sel.tab) { endSelect(); return true; }
  if (mover.paths) { endMove(); return true; }
  if (picking) { endPick(); return true; }
  if (!$("#searchBar").hidden) { $("#btnSearchClose").click(); return true; }
  if (drawerOpen()) { closeDrawer(); return true; }
  return false;
};

// 화면 코드 오류가 조용히 묻히지 않게 알림으로 (같은 오류는 한 번만)
const shownErrors = new Set();
function reportError(msg) {
  msg = String(msg || "알 수 없는 오류");
  if (shownErrors.has(msg)) return;
  shownErrors.add(msg);
  try { toast("화면 오류: " + msg, { error: true, timeout: 10000 }); } catch {}
}
window.addEventListener("error", e => reportError(e.message));
window.addEventListener("unhandledrejection", e => reportError(e.reason && (e.reason.message || e.reason)));
window.addEventListener("pywebviewready", () => { if (!booted) { booted = true; init(); } });
</script>
